name: DET-57 preview browser QA
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  browser-qa:
    if: ${{ github.event.pull_request.number == 2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source regression checks
        run: |
          python3 tools/check-home.py
          node tools/check-pricing.cjs
      - name: DET-54 revoked affiliate source sweep
        run: node tools/check-det54-integrity.cjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.11.0 lighthouse@13.6.0
          npx playwright install --with-deps chromium webkit
      - name: Lighthouse same-run local main vs PR candidate
        run: |
          mkdir -p /tmp/det57-main qa-artifacts
          git archive 6ec4c63a49f2763036eff223ecc2b061f6decb0b | tar -x -C /tmp/det57-main
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/det57-main > qa-artifacts/server-main.log 2>&1 &
          pid1=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory . > qa-artifacts/server-candidate.log 2>&1 &
          pid2=$!
          trap 'kill $pid1 $pid2 2>/dev/null || true' EXIT
          sleep 2
          node tools/check-det57-performance.cjs
      - name: Run public preview read-only acceptance
        env:
          DET57_PREVIEW_URL: https://det-57-release-reconciled-20261108-detailerfit-git.carmelo7kobe24.workers.dev
        run: node tools/check-det57-preview.cjs
      - name: Stage guarded bridge ZIP (do NOT send)
        run: python3 tools/stage-det57-bridge.py
      - name: Reproduce exact bridge ZIP changes on detached main
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/det57-bridge-fixture origin/main
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          root=Path('/tmp/det57-bridge-fixture')
          archive=Path('qa-artifacts/bridge-candidate/detailerfit-deploy.zip')
          with ZipFile(archive) as z:
              assert z.testzip() is None
              m=json.loads(z.read('detailerfit-command.json'))
              assert m['base_commit']=='6ec4c63a49f2763036eff223ecc2b061f6decb0b'
              assert m['delete']==[]
              assert len(m['replace'])==11
              for name in m['replace']:
                  dest=root/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read('payload/'+name))
          print('STAGED FILES REAPPLIED TO FRESH MAIN:',len(m['replace']))
          PY
          cd /tmp/det57-bridge-fixture
          git diff --check
          python3 tools/check-home.py
          python3 tools/check-release.py
          python3 tools/check-sitewide.py
          python3 tools/check-det57.py
          node tools/check-pricing.cjs
          echo "PASS exact mailed ZIP applied over clean main and release suites"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: det57-bridge-candidate-NOT-SENT
          path: qa-artifacts/bridge-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: det57-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
