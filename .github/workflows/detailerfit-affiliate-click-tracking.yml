name: DetailerFit Affiliate Click Taxonomy Fix

on:
  push:
    paths:
      - ".github/workflows/detailerfit-affiliate-click-tracking.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tracking-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix affiliate click classification
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("app.js")
          if not app_path.exists():
              raise RuntimeError("app.js not found")

          app = app_path.read_text(encoding="utf-8")

          marker = "// DetailerFit revenue telemetry taxonomy v2."
          if marker in app:
              print("Tracking taxonomy v2 already applied.")
          else:
              old = """  const vendor=(link.dataset.vendor||'').trim();
            if(vendor){
              dfTrackEvent('affiliate_click',{
                vendor,
                link_url:link.href,
                link_text:(link.textContent||'').trim().slice(0,120),
                cta_position:dfLinkContext(link)
              });
              return;
            }
          """

              new = """  const vendor=(link.dataset.vendor||'').trim();
            if(vendor){
              // DetailerFit revenue telemetry taxonomy v2.
              // `data-vendor` identifies a vendor link, but only sponsored links are
              // revenue clicks. `data-affiliate="true"` is an explicit override for
              // future monetized links that cannot use rel="sponsored".
              const relTokens=(link.getAttribute('rel')||'')
                .toLowerCase()
                .split(/\\s+/)
                .filter(Boolean);
              const isAffiliate=relTokens.includes('sponsored')||link.dataset.affiliate==='true';

              dfTrackEvent(isAffiliate?'affiliate_click':'vendor_outbound_click',{
                vendor,
                link_url:link.href,
                link_host:link.hostname,
                link_text:(link.textContent||'').trim().slice(0,120),
                cta_position:dfLinkContext(link),
                monetized:isAffiliate
              });
              return;
            }
          """

              if old not in app:
                  raise RuntimeError(
                      "Expected pre-fix vendor click handler was not found. "
                      "Stop rather than patching unknown code."
                  )

              app = app.replace(old, new, 1)
              app_path.write_text(app, encoding="utf-8")
              print("Applied tracking taxonomy v2.")

          audit = """# DetailerFit Revenue Click Tracking Audit — 2026-09-15

          ## Confirmed before this patch
          - `app.js` creates a `dataLayer` event and calls `gtag()` only when `window.gtag` already exists.
          - The current site code loads `app.js` and the Cloudflare Web Analytics beacon.
          - No Google Analytics 4 or Google Tag Manager loader was found in the audited site code.
          - Therefore the custom `affiliate_click` events are not currently persisted by GA4/GTM.
          - Cloudflare Web Analytics is useful for traffic/performance analytics, but it does not currently support custom events.

          ## Problem fixed here
          Before this patch, every link with `data-vendor` was recorded as `affiliate_click`, including ordinary vendor/pricing links that were not monetized.

          After this patch:
          - `affiliate_click` = a vendor link whose `rel` contains `sponsored`, or an explicit future `data-affiliate="true"` override.
          - `vendor_outbound_click` = a `data-vendor` link that is not monetized.
          - Both event types retain vendor, URL, host, CTA position and link text context.
          - Existing rankings, links, design, SEO content and affiliate destinations are unchanged.

          ## Still required for persistent conversion reporting
          A real custom-event destination still needs to be configured. Recommended next step: add GA4 or GTM only after the correct Measurement ID / Container ID is available, then verify events in Realtime / DebugView before relying on reports.

          Do not add a fake or placeholder analytics ID.
          """
          Path("TRACKING-AUDIT-2026-09-15.md").write_text(audit, encoding="utf-8")

      - name: Validate JavaScript and tracking markers
        shell: bash
        run: |
          node --check app.js
          grep -q "DetailerFit revenue telemetry taxonomy v2" app.js
          grep -q "vendor_outbound_click" app.js
          grep -q "isAffiliate?'affiliate_click':'vendor_outbound_click'" app.js
          git diff --check
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js TRACKING-AUDIT-2026-09-15.md
          git commit -m "Fix affiliate click event classification"
          git push
