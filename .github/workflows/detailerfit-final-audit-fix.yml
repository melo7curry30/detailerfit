            <p class="small">DetailPilot also advertises discounted quarterly and yearly billing. Pricing can change; verify the current checkout before subscribing.</p>

            <h2>What the free Starter plan gives a new detailer</h2>
            <p>The free plan is the most distinctive part of DetailPilot's pricing. Public product information lists online booking, deposits, invoicing, customer management and online/on-site payments as part of the platform. Starter is limited to 10 bookings per month and applies a 1% fee to online transactions.</p>
            <p>That makes Starter more useful as a real operating tier than a short free trial, but a detailer processing meaningful payment volume should compare the transaction fee against the $29 Growth plan.</p>

