          ]

          local_href_re = re.compile(
              r'(?P<attr>href|action)=(?P<q>["\'])(?P<url>[^"\']+)(?P=q)',
              re.I,
          )

          def clean_local_url(url: str) -> str:
              if url.startswith(("#", "mailto:", "tel:", "javascript:", "data:")):
                  return url

              for old_domain in workers_domains:
                  if url.startswith(old_domain):
                      url = DOMAIN + url[len(old_domain):]

              if url.startswith(DOMAIN):
                  rest = url[len(DOMAIN):] or "/"
                  rest = re.sub(r"/index\.html(?=([?#]|$))", "/", rest, flags=re.I)
                  rest = re.sub(r"/([A-Za-z0-9_-]+)\.html(?=([?#]|$))", r"/\1", rest, flags=re.I)
                  return DOMAIN + rest

              parsed = urlsplit(url)
              if parsed.scheme or parsed.netloc:
                  return url

              base = parsed.path
              suffix = ""
              if parsed.query:
                  suffix += "?" + parsed.query
              if parsed.fragment:
                  suffix += "#" + parsed.fragment

              if base in ("index.html", "/index.html"):
                  return "/" + suffix
              m = re.fullmatch(r"/?([A-Za-z0-9_-]+)\.html", base, re.I)
              if m:
                  return "/" + m.group(1) + suffix
              return url

          canonical_re = re.compile(
              r'<link\b(?=[^>]*\brel\s*=\s*["\']canonical["\'])[^>]*>\s*',
              re.I,
