                      canonical = DOMAIN + "/" + duplicate_match.group("base")
                      text = canonical_re.sub("", text)
                      text = og_re.sub("", text)
                      idx = text.lower().find("</head>")
                      if idx >= 0:
                          text = text[:idx] + f'<link rel="canonical" href="{canonical}">\n<meta property="og:url" content="{canonical}">\n' + text[idx:]
                      write(p, text)
                      continue

              indexable.append(p)

          for p in indexable:
              text = read(p)

              for old_domain in workers_domains:
                  text = text.replace(old_domain, DOMAIN)

              text = re.sub(
                  re.escape(DOMAIN) + r"/index\.html(?=([?#\"'<\s]|$))",
                  DOMAIN + r"/\1",
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  re.escape(DOMAIN) + r"/([A-Za-z0-9_-]+)\.html(?=([?#\"'<\s]|$))",
                  DOMAIN + r"/\1\2",
                  text,
                  flags=re.I,
              )

              text = local_href_re.sub(
                  lambda m: f'{m.group("attr")}={m.group("q")}{clean_local_url(m.group("url"))}{m.group("q")}',
                  text,
              )

              text = canonical_re.sub("", text)
              text = og_re.sub("", text)

              url = page_url(p)
              tags = (
                  f'<link rel="canonical" href="{url}">\n'
                  f'<meta property="og:url" content="{url}">\n'
              )
              idx = text.lower().find("</head>")
              if idx < 0:
                  raise SystemExit(f"{p}: missing </head>")
              text = text[:idx] + tags + text[idx:]
              write(p, text)

          p404 = ROOT / "404.html"
          if p404.exists():
              text = read(p404)
              text = canonical_re.sub("", text)
              text = og_re.sub("", text)
              if not re.search(r'<meta[^>]+name=["\']robots["\']', text, re.I):
                  idx = text.lower().find("</head>")
                  if idx >= 0:
                      text = text[:idx] + '<meta name="robots" content="noindex,follow">\n' + text[idx:]
              write(p404, text)

          # --------------------------------------------------------------
          # 8) Sitemap + robots
          # --------------------------------------------------------------
          urls = [page_url(p) for p in indexable]
          urls = sorted(set(urls), key=lambda u: (u != DOMAIN + "/", u))

          sitemap_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
          ]
          for url in urls:
              sitemap_lines.extend([
                  "  <url>",
                  f"    <loc>{url}</loc>",
                  "  </url>",
              ])
          sitemap_lines.append("</urlset>")
          write(ROOT / "sitemap.xml", "\n".join(sitemap_lines) + "\n")

          write(
              ROOT / "robots.txt",
              "User-agent: *\n"
              "Allow: /\n\n"
              f"Sitemap: {DOMAIN}/sitemap.xml\n",
          )

          # --------------------------------------------------------------
          # 9) Validation
          # --------------------------------------------------------------
          errors = []

          mtrx = read(mtrx_review)
          bad_mtrx_phrases = [
              "Card required to start; no charge until trial ends",
              "Credit card required to start; no charge until trial ends",
              "Credit/debit card required to start; no charge until trial ends",
          ]
          for phrase in bad_mtrx_phrases:
              if phrase.lower() in mtrx.lower():
                  errors.append(f"Mobile Tech RX trial error remains: {phrase}")
          if "No credit card required to start" not in mtrx:
              errors.append("Mobile Tech RX review does not contain the verified no-card trial wording")

          if not detailpilot_page.exists():
              errors.append("DetailPilot review page was not created")
          else:
              dp = read(detailpilot_page)
              for required in [
                  "https://detailpilot.com/?via=ryo",
                  "$29",
                  "$59",
                  "$119",
                  "1% fee",
                  "Affiliate disclosure",
              ]:
                  if required not in dp:
                      errors.append(f"DetailPilot review missing: {required}")

          for p in ROOT.glob("*.html"):
              text = read(p)
              for match in anchor_re.finditer(text):
                  tag = match.group(0)
                  unescaped = html_lib.unescape(tag)
                  for url, vendor in AFFILIATES:
                      if url in unescaped:
                          rel = re.search(r'\brel\s*=\s*["\']([^"\']+)["\']', tag, re.I)
                          data_vendor = re.search(r'\bdata-vendor\s*=\s*["\']([^"\']+)["\']', tag, re.I)
                          rel_tokens = set(rel.group(1).lower().split()) if rel else set()
                          if not {"sponsored", "noopener"}.issubset(rel_tokens):
                              errors.append(f"{p}: affiliate link missing sponsored/noopener for {vendor}")
                          if not data_vendor or data_vendor.group(1) != vendor:
                              errors.append(f"{p}: affiliate link missing correct data-vendor for {vendor}")

          can_extract = re.compile(
              r'<link\b(?=[^>]*\brel\s*=\s*["\']canonical["\'])'
              r'(?=[^>]*\bhref\s*=\s*["\']([^"\']+)["\'])[^>]*>',
              re.I,
          )
          og_extract = re.compile(
              r'<meta\b(?=[^>]*\bproperty\s*=\s*["\']og:url["\'])'
              r'(?=[^>]*\bcontent\s*=\s*["\']([^"\']+)["\'])[^>]*>',
              re.I,
          )

          for p in indexable:
              text = read(p)
              expected = page_url(p)
              cans = can_extract.findall(text)
              ogs = og_extract.findall(text)
              if cans != [expected]:
                  errors.append(f"{p}: canonical {cans!r} != {expected}")
              if ogs != [expected]:
                  errors.append(f"{p}: og:url {ogs!r} != {expected}")
              if "detailerfit-git.carmelo7kobe24.workers.dev" in text:
                  errors.append(f"{p}: legacy workers.dev URL remains")

          sitemap = read(ROOT / "sitemap.xml")
          locs = re.findall(r"<loc>(.*?)</loc>", sitemap)
          if locs != urls:
              errors.append("sitemap.xml does not match final canonical URL set")
          if any(".html" in u for u in locs):
              errors.append("sitemap.xml still contains .html URLs")

          broken = set()
          href_extract = re.compile(r'href\s*=\s*["\']([^"\']+)["\']', re.I)
          for p in indexable:
              text = read(p)
              for href in href_extract.findall(text):
                  href = href.strip()
                  if not href or href.startswith(("#", "mailto:", "tel:", "javascript:", "data:")):
                      continue
                  parsed = urlsplit(href)
                  if parsed.scheme in ("http", "https") or parsed.netloc:
                      continue

                  path = parsed.path
                  if not path:
                      continue
                  suffix = Path(path).suffix.lower()
                  if suffix and suffix != ".html":
                      # Asset/download link, not an internal HTML destination.
                      continue
                  if path == "/":
                      candidate = ROOT / "index.html"
                  elif path.endswith(".html"):
                      candidate = ROOT / path.lstrip("/")
                  else:
                      candidate = ROOT / (path.lstrip("/") + ".html")

                  if not candidate.exists():
                      broken.add(f"{p.name} -> {href}")

          for item in sorted(broken):
              errors.append("Broken internal page link: " + item)

          if errors:
              print("\nVALIDATION FAILED")
              for e in errors:
                  print(" -", e)
              raise SystemExit(1)

          print("DetailerFit final audit validation passed.")
          print(f"Indexable HTML pages: {len(indexable)}")
          print("Affiliate vendors detected:", ", ".join(detected))
          print("DetailPilot review:", detailpilot_page)
          print("Mobile Tech RX trial wording: corrected")

          if WORKFLOW.exists():
              WORKFLOW.unlink()
          PY

      - name: Show diff and run whitespace check
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat
          git diff -- \
            mobile-tech-rx-review-auto-detailers.html \
            detailpilot-review-auto-detailers.html \
            finder.html \
            software-cost-calculator.html \
            affiliate-disclosure.html \
            best-auto-detailing-software-2026.html \
            best-ai-receptionists-auto-detailing.html \
            best-ai-software-auto-detailing.html \
            reviews.html \
            sitemap.xml \
            robots.txt || true

      - name: Commit and push final audit fixes
        shell: bash
        run: |
          git config user.name "DetailerFit Final Audit"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "Finish DetailerFit audit and monetization fixes"
          git push
