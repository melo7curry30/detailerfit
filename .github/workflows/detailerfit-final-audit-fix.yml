                  return text[:idx] + block + "\n" + text[idx:]
              idx = text.lower().rfind("</body>")
              if idx >= 0:
                  return text[:idx] + block + "\n" + text[idx:]
              return text + "\n" + block + "\n"

          def replace_generated_block(text: str, block_id: str, block: str) -> str:
