                  rf'<!-- {re.escape(block_id)} START -->.*?<!-- {re.escape(block_id)} END -->',
                  re.I | re.S,
              )
              wrapped = f"<!-- {block_id} START -->\n{block}\n<!-- {block_id} END -->"
              if pat.search(text):
                  return pat.sub(wrapped, text, count=1)
              return insert_before_main_close(text, wrapped)

