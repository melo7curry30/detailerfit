          # --------------------------------------------------------------
          # 5) Harden confirmed affiliate links
          # --------------------------------------------------------------
          anchor_re = re.compile(r"<a\b[^>]*>", re.I)

          def harden_anchor(tag: str) -> str:
              matched_vendor = None
              for url, vendor in AFFILIATES:
                  if url in html_lib.unescape(tag):
                      matched_vendor = vendor
                      break
              if not matched_vendor:
                  return tag

              if re.search(r'\brel\s*=\s*["\'][^"\']*["\']', tag, flags=re.I):
                  tag = re.sub(
                      r'\brel\s*=\s*(["\'])[^"\']*\1',
                      'rel="sponsored noopener"',
                      tag,
                      count=1,
                      flags=re.I,
                  )
              else:
                  tag = tag[:-1] + ' rel="sponsored noopener">'

              if re.search(r'\bdata-vendor\s*=', tag, flags=re.I):
