            <p>Growth raises the booking allowance to 50 per month and removes the DetailPilot platform fee. Public pricing also lists SMS automations, promotions and discounts, Google review tools, on-my-way tracking, traffic-source analytics, Google Calendar sync, travel fees and custom booking questions.</p>

