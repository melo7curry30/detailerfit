name: DetailerFit - Add Jotform Affiliate Revenue Paths

on:
  push:
    paths:
      - ".github/workflows/detailerfit-jotform-affiliate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detailerfit-jotform-affiliate
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Add Jotform review and affiliate placements safely
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import re
          import xml.etree.ElementTree as ET

          ROOT = Path(".")
          AFFILIATE_URL = "https://www.jotform.com/?partner=getdetailerfit"
          SLUG = "/jotform-review-auto-detailers"
          CANONICAL = "https://getdetailerfit.com" + SLUG
          MARKER = "<!-- DETAILERFIT-JOTFORM-V1 -->"
          DISCLOSURE_MARKER = "<!-- DETAILERFIT-JOTFORM-DISCLOSURE-V1 -->"
          SOURCE_DATE = "September 15, 2026"
          ISO_DATE = "2026-09-15"

          OFFICIAL_HOME = "https://www.jotform.com/"
          PRICING_URL = "https://www.jotform.com/pricing/"
          MOBILE_URL = "https://www.jotform.com/products/mobile-forms/"
          APPOINTMENTS_URL = "https://www.jotform.com/products/appointments/"
          APPS_URL = "https://www.jotform.com/products/apps/"

          REQUIRED = [
              "reviews.html",
              "affiliate-disclosure.html",
              "sitemap.xml",
              "styles.css",
              "app.js",
          ]
          OPTIONAL = [
              "best-crm-solo-mobile-detailers.html",
              "best-mobile-detailing-software.html",
              "best-auto-detailing-software-2026.html",
              "guides.html",
          ]

          for name in REQUIRED:
              if not (ROOT / name).is_file():
                  raise RuntimeError(f"Required file missing: {name}")

          def read(name):
              return (ROOT / name).read_text(encoding="utf-8")

          def write(name, text):
              (ROOT / name).write_text(text, encoding="utf-8")

          original = {name: read(name) for name in REQUIRED}
          for name in OPTIONAL:
              if (ROOT / name).is_file():
                  original[name] = read(name)

          changes = {}

          def current(name):
              if name in changes:
                  return changes[name]
              path = ROOT / name
              return path.read_text(encoding="utf-8") if path.is_file() else None

          def insert_before_last(text, closing_tag, addition):
              pos = text.lower().rfind(closing_tag.lower())
              if pos < 0:
                  raise RuntimeError(f"Required closing tag missing: {closing_tag}")
              return text[:pos] + addition + "\n" + text[pos:]

          def tracked_cta(label):
              return (
                  '<a class="btn primary" data-vendor="Jotform" '
                  f'href="{AFFILIATE_URL}" rel="sponsored noopener" '
                  f'target="_blank">{label}</a>'
              )

          LOCAL_DISCLOSURE = (
              '<p class="cta-disclosure small">'
              'DetailerFit may earn a commission if you sign up through this link, '
              'at no extra cost to you. '
              '<a href="/affiliate-disclosure">Affiliate disclosure</a>.'
              '</p>'
          )

          # 1) Dedicated research-based review. Reuse current header/footer/CSS/JS.
          base = original["reviews.html"]
          header_match = re.search(r"<header\b[\s\S]*?</header>", base, flags=re.I)
          footer_match = re.search(r"<footer\b[\s\S]*?</footer>", base, flags=re.I)
          if not header_match or not footer_match:
              raise RuntimeError("Could not reuse current DetailerFit header/footer.")
          header = header_match.group(0)
          footer = footer_match.group(0)

          schema = {
              "@context": "https://schema.org",
              "@graph": [
                  {
                      "@type": "Article",
                      "@id": CANONICAL + "#article",
                      "headline": "Jotform Review for Auto Detailers (2026)",
                      "description": (
                          "Research-based Jotform review for auto detailers covering lead and quote "
                          "forms, appointments, mobile/offline forms, pricing and limitations."
                      ),
                      "dateModified": ISO_DATE,
                      "mainEntityOfPage": {"@type": "WebPage", "@id": CANONICAL},
                      "author": {"@type": "Organization", "name": "DetailerFit", "url": "https://getdetailerfit.com/"},
                      "publisher": {"@type": "Organization", "name": "DetailerFit", "url": "https://getdetailerfit.com/"},
                      "inLanguage": "en-US",
                  },
                  {
                      "@type": "BreadcrumbList",
                      "itemListElement": [
                          {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://getdetailerfit.com/"},
                          {"@type": "ListItem", "position": 2, "name": "Reviews", "item": "https://getdetailerfit.com/reviews"},
                          {"@type": "ListItem", "position": 3, "name": "Jotform Review", "item": CANONICAL},
                      ],
                  },
                  {
                      "@type": "FAQPage",
                      "mainEntity": [
                          {
                              "@type": "Question",
                              "name": "Is Jotform useful for an auto detailing business?",
                              "acceptedAnswer": {
                                  "@type": "Answer",
                                  "text": (
                                      "Yes, especially as a flexible form and intake layer for quote requests, "
                                      "customer information, acknowledgements, appointments and field data. "
                                      "It is not a detailing-specific CRM or full shop-management platform."
                                  ),
                              },
                          },
                          {
                              "@type": "Question",
                              "name": "How much does Jotform cost?",
                              "acceptedAnswer": {
                                  "@type": "Answer",
                                  "text": (
                                      "When checked September 15, 2026, Jotform listed Starter as free, "
                                      "Bronze at $34 per month billed annually, Silver at $39 per month billed "
                                      "annually, and Gold at $99 per month billed annually."
                                  ),
                              },
                          },
                          {
                              "@type": "Question",
                              "name": "Can detailers use Jotform on a phone or tablet?",
                              "acceptedAnswer": {
                                  "@type": "Answer",
                                  "text": (
                                      "Yes. Jotform Mobile Forms is available for iOS and Android and supports "
                                      "on-the-go form management and offline data collection."
                                  ),
                              },
                          },
                      ],
                  },
              ],
          }

          review = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#090d12">
          <title>Jotform Review for Auto Detailers (2026) | DetailerFit</title>
          <meta name="description" content="Research-based Jotform review for auto detailers: quote and intake forms, appointments, mobile/offline forms, pricing, use cases and limitations.">
          <link rel="canonical" href="{CANONICAL}">
          <link rel="stylesheet" href="/styles.css">
          <meta property="og:title" content="Jotform Review for Auto Detailers (2026)">
          <meta property="og:description" content="Can Jotform improve lead capture, intake, appointments and field paperwork for a detailing business? See current pricing, mobile features and limitations.">
          <meta property="og:type" content="article">
          <meta property="og:url" content="{CANONICAL}">
          <meta name="twitter:card" content="summary">
          <script type="application/ld+json">{json.dumps(schema, separators=(",", ":"))}</script>
          </head>
          <body>
          <a class="skip-link" href="#main-content">Skip to content</a>
          {header}
          {MARKER}
          <main id="main-content" tabindex="-1">

          <section class="heroMini"><div class="wrap">
          <div class="breadcrumbs"><a href="/">Home</a> / <a href="/reviews">Reviews</a> / Jotform</div>
          <span class="eyebrow">FORMS &amp; INTAKE · MOBILE FRIENDLY · RESEARCH-BASED · {SOURCE_DATE}</span>
          <h1>Jotform Review for Auto Detailers</h1>
          <p class="lead">Jotform is not an auto-detailing CRM. Its value is flexibility: detailers can build lead forms, quote requests, customer intake, acknowledgements, appointment flows and mobile field forms without coding. It works best as a form and workflow layer around the rest of your stack—not as a replacement for detailing-specific estimating, job management or customer history.</p>
          <div class="actions">
          {tracked_cta("Try Jotform")}
          <a class="btn secondary" href="/best-auto-detailing-software-2026">Compare Detailing Software</a>
          </div>
          {LOCAL_DISCLOSURE}
          </div></section>

          <section class="section"><div class="wrap article">
          <aside class="research-context research-block" aria-label="Research transparency">
          <details open>
          <summary>Research-based · Source check: {SOURCE_DATE} · How we researched this</summary>
          <div><strong>Research basis</strong><span>Current Jotform pricing, Mobile Forms, Appointments and Jotform Apps product documentation.</span></div>
          <div><strong>Hands-on testing</strong><span>Not claimed for this review.</span></div>
          <div><strong>Positioning</strong><span>Jotform is evaluated as a flexible form, intake and workflow tool—not a detailing-specific CRM or shop operating system.</span></div>
          <p><a href="/methodology">How we review software</a> · <a href="/affiliate-disclosure">Affiliate disclosure</a>.</p>
          </details>
          </aside>

          <h2>Quick verdict</h2>
          <div class="verdict">
          <p><strong>Best fit:</strong> solo and small detailing businesses that want more control over lead capture, quote requests, customer intake, acknowledgements, appointment requests or mobile data collection.</p>
          <p><strong>Look elsewhere first if:</strong> you want one system to handle detailing-specific estimates, service menus, vehicle/job history, dispatch, invoicing, technician workflows and CRM follow-up out of the box.</p>
          </div>

          <h2>What Jotform can do for a detailing business</h2>
          <p>Jotform is a general form and workflow platform. For detailers, the practical use cases are usually customer-facing intake and lightweight operational forms: capturing a lead before it disappears, collecting vehicle/service information before a quote, getting an acknowledgement or signature, scheduling an appointment flow, or collecting structured information while working away from a desk.</p>

          <h3>Lead and quote-request forms</h3>
          <p>A detailer can create a branded form for contact details, vehicle information, requested services and preferred timing, then link or embed it from a website, social profile or campaign. This is useful when a generic contact form is too limited but a full CRM migration would be overkill.</p>

          <h3>Mobile and offline forms</h3>
          <p>Jotform Mobile Forms is available on iOS and Android. Jotform says the app can collect data offline and supports advanced mobile fields including electronic signatures, geolocation, barcode scanning and recorded voice. For mobile operators, offline collection can matter where connectivity is poor.</p>

          <h3>Appointment workflows</h3>
          <p>Jotform Appointments can sync with Google Calendar, Outlook and Calendly, automate reminders, accept payments before confirming bookings and trigger workflows once appointments are set. That can make it useful as a customizable scheduling layer when a detailer does not need a full detailing-native booking platform.</p>

          <h3>Simple customer-facing apps</h3>
          <p>Jotform Apps can combine forms, widgets and branding into a shareable app-like experience. Jotform lists appointment scheduling, payment collection and workflow automation among the functions that can be brought into an app.</p>

          <h2>Current Jotform pricing</h2>
          <p>The current public pricing page offers a free Starter plan and paid Bronze, Silver and Gold tiers. The figures below are the published monthly equivalents when billed annually.</p>
          <div class="tablewrap" role="region" tabindex="0" aria-label="Jotform pricing">
          <table>
          <thead><tr><th>Plan</th><th>Published annual-billing rate</th><th>Forms</th><th>Monthly submissions</th></tr></thead>
          <tbody>
          <tr><td>Starter</td><td>Free</td><td>5</td><td>100</td></tr>
          <tr><td>Bronze</td><td>$34/mo</td><td>25</td><td>1,000</td></tr>
          <tr><td>Silver</td><td>$39/mo</td><td>50</td><td>2,500</td></tr>
          <tr><td>Gold</td><td>$99/mo</td><td>100</td><td>10,000</td></tr>
          </tbody>
          </table>
          </div>
          <p class="small">Pricing checked {SOURCE_DATE}. Jotform says annual billing can save up to 20%. Starter includes Jotform branding; the paid tiers above remove Jotform branding. Plan limits and promotional pricing can change, so verify the live pricing page before subscribing.</p>

          <h2>Which plan makes sense for a solo detailer?</h2>
          <p><strong>Starter</strong> is the sensible proof-of-concept tier: build a few real forms and confirm the workflow before paying. <strong>Bronze</strong> is the first obvious paid step when five forms or 100 monthly submissions become restrictive and you want to remove Jotform branding. <strong>Silver</strong> becomes more relevant when form count or submission volume grows. <strong>Gold</strong> is usually harder to justify for a small detailing operation unless much higher limits or Gold-specific features are genuinely needed.</p>

          <div class="actions">
          {tracked_cta("Start with Jotform")}
          <a class="btn secondary" href="/finder">Use the Software Finder</a>
          </div>
          {LOCAL_DISCLOSURE}

          <h2>Where Jotform is weaker for auto detailing</h2>
          <p>Flexibility is not the same as vertical specialization. Jotform's official product pages focus on forms, data collection, appointments, apps and workflows rather than detailing-specific estimating, package logic, vehicle records, job boards or technician operations. A business that wants an all-in-one detailing operating system should compare specialist platforms first and use Jotform only if a flexible form layer still fills a gap.</p>

          <h2>Jotform vs detailing-specific software</h2>
          <div class="tablewrap" role="region" tabindex="0" aria-label="Jotform versus detailing software">
          <table>
          <thead><tr><th>Need</th><th>Jotform</th><th>Detailing-specific software</th></tr></thead>
          <tbody>
          <tr><td>Custom lead / intake forms</td><td><strong>Core strength</strong></td><td>Varies</td></tr>
          <tr><td>Offline mobile forms</td><td><strong>Core strength</strong></td><td>Varies</td></tr>
          <tr><td>Appointments + calendar sync</td><td>Available</td><td>Often included</td></tr>
          <tr><td>Electronic signatures</td><td>Available</td><td>Varies</td></tr>
          <tr><td>Detailing-specific estimates and packages</td><td>Requires custom setup</td><td><strong>Usually stronger</strong></td></tr>
          <tr><td>Vehicle / job history</td><td>General form data</td><td><strong>Usually stronger</strong></td></tr>
          <tr><td>Shop / technician operations</td><td>Not the core product</td><td><strong>Usually stronger</strong></td></tr>
          </tbody>
          </table>
          </div>

          <h2>Practical test before paying</h2>
          <p>Build one real workflow first: a ceramic-coating quote request or new-customer intake form. Put it on your phone, test offline collection, test the customer confirmation, and see whether the information arrives in a format you would actually use. Then test an appointment flow if scheduling is part of the problem. If the setup removes manual back-and-forth without creating another disconnected database, Jotform can be a useful companion tool.</p>

          <h2>Official sources</h2>
          <div class="sourcebox">
          <a href="{OFFICIAL_HOME}" rel="noopener" target="_blank">Jotform — Official site</a><br>
          <a href="{PRICING_URL}" rel="noopener" target="_blank">Jotform — Pricing</a><br>
          <a href="{MOBILE_URL}" rel="noopener" target="_blank">Jotform — Mobile Forms</a><br>
          <a href="{APPOINTMENTS_URL}" rel="noopener" target="_blank">Jotform — Appointments</a><br>
          <a href="{APPS_URL}" rel="noopener" target="_blank">Jotform — Apps</a>
          </div>
          <p class="small">Source check: {SOURCE_DATE}. Features, submission limits, payment limits and pricing can change. Verify current details directly with Jotform before purchase.</p>

          <h2>Bottom line</h2>
          <p>Jotform is strongest for detailers who need a flexible front door into the business: better intake, quote requests, signatures, appointments and structured mobile forms. It is not the best answer if the real problem is end-to-end detailing operations. Used alongside the right CRM or job-management tool, it can cover workflows that rigid industry software does not.</p>

          <div class="actions">
          {tracked_cta("Try Jotform")}
          <a class="btn secondary" href="/best-mobile-detailing-software">Compare Mobile Software</a>
          </div>
          {LOCAL_DISCLOSURE}
          </div></section>
          </main>
          {footer}
          <script src="/app.js"></script>
          </body>
          </html>
          """

          review_path = ROOT / "jotform-review-auto-detailers.html"
          if review_path.exists():
              existing = read(review_path.name)
              if MARKER not in existing:
                  raise RuntimeError("jotform-review-auto-detailers.html already exists without the DetailerFit marker.")
          else:
              changes[review_path.name] = review

          # 2) Additive placements only. Existing rankings remain untouched.
          placements = {
              "reviews.html": (
                  "FORMS & INTAKE",
                  "Jotform for auto detailers",
                  "Jotform is a flexible form, intake, appointment and mobile data-collection tool. It is most useful when a detailer needs custom lead or customer workflows without replacing the entire operating stack.",
                  "Read the Jotform review",
              ),
              "best-crm-solo-mobile-detailers.html": (
                  "COMPANION TOOL · LEAD CAPTURE",
                  "Jotform as a front end for your CRM",
                  "Jotform is not added to the CRM ranking. Consider it separately when you like your CRM but need more flexible quote-request, intake, acknowledgement or appointment forms feeding the sales process.",
                  "See the Jotform use case",
              ),
              "best-mobile-detailing-software.html": (
                  "ALSO CONSIDER · MOBILE FORMS",
                  "Flexible offline forms for mobile detailers",
                  "Jotform Mobile Forms can collect structured data offline from iOS and Android devices. It is a companion option for mobile operators who need custom intake or field forms rather than another full detailing platform.",
                  "Research Jotform",
              ),
              "best-auto-detailing-software-2026.html": (
                  "ALSO CONSIDER · CUSTOM WORKFLOWS",
                  "Jotform when flexible forms are the missing layer",
                  "Jotform is not a detailing operating system and is not added to the ranked picks above. It can fill gaps around lead capture, customer intake, signatures, appointments and custom forms.",
                  "Evaluate Jotform",
              ),
              "guides.html": (
                  "FORM & INTAKE REVIEW",
                  "Jotform for auto detailing workflows",
                  "Research Jotform for lead capture, quote requests, customer intake, mobile/offline forms, signatures and customizable appointment flows.",
                  "Read the Jotform review",
              ),
          }

          for filename, (kicker, heading, paragraph, label) in placements.items():
              if not (ROOT / filename).is_file():
                  continue
              text = current(filename)
              page_marker = f"{MARKER}-{filename}"
              if page_marker in text:
                  continue
              block = f"""
          {page_marker}
          <section class="section tight" aria-labelledby="jotform-option-{filename.replace('.', '-')}">
          <div class="wrap article"><div class="card">
          <div class="kicker">{kicker}</div>
          <h2 id="jotform-option-{filename.replace('.', '-')}">{heading}</h2>
          <p>{paragraph}</p>
          <p class="small">Research checked {SOURCE_DATE}. Jotform is a general form and workflow platform, not detailing-specific operating software.</p>
          <div class="actions">
          <a class="btn secondary" href="{SLUG}">{label}</a>
          {tracked_cta("Visit Jotform")}
          </div>
          {LOCAL_DISCLOSURE}
          </div></div></section>
          """
              changes[filename] = insert_before_last(text, "</main>", block)

          # 3) Affiliate disclosure.
          disclosure = current("affiliate-disclosure.html")
          if DISCLOSURE_MARKER not in disclosure:
              disclosure_block = f"""
          {DISCLOSURE_MARKER}
          <section class="section tight" aria-labelledby="jotform-affiliate-relationship">
          <div class="wrap article"><div class="note">
          <h2 id="jotform-affiliate-relationship">Jotform affiliate relationship</h2>
          <p>DetailerFit participates in the Jotform Affiliate Partner Program and may earn a commission from qualifying paid subscriptions made through clearly marked Jotform affiliate links, at no extra cost to the reader. Affiliate compensation does not buy ranking position or change our editorial conclusions.</p>
          </div></div></section>
          """
              changes["affiliate-disclosure.html"] = insert_before_last(disclosure, "</main>", disclosure_block)

          # 4) Sitemap.
          sitemap = current("sitemap.xml")
          ET.fromstring(sitemap)
          locs = re.findall(r"<loc>\s*(.*?)\s*</loc>", sitemap, flags=re.I)
          if CANONICAL not in locs:
              sitemap = insert_before_last(
                  sitemap,
                  "</urlset>",
                  f"  <url><loc>{CANONICAL}</loc><lastmod>{ISO_DATE}</lastmod></url>",
              )
              ET.fromstring(sitemap)
              changes["sitemap.xml"] = sitemap

          # 5) Validation.
          class Elements(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.canonicals = []
                  self.h1_count = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == "a":
                      self.links.append(attrs)
                  elif tag == "link" and attrs.get("rel") == "canonical":
                      self.canonicals.append(attrs.get("href"))
                  elif tag == "h1":
                      self.h1_count += 1

          def parse_html(text):
              parser = Elements()
              parser.feed(text)
              return parser

          final_review = changes.get(
              review_path.name,
              review_path.read_text(encoding="utf-8") if review_path.exists() else "",
          )
          parsed_review = parse_html(final_review)

          if parsed_review.canonicals != [CANONICAL]:
              raise RuntimeError("Jotform review canonical is invalid.")
          if parsed_review.h1_count != 1:
              raise RuntimeError("Jotform review must contain exactly one H1.")

          review_affiliate_links = [a for a in parsed_review.links if a.get("href") == AFFILIATE_URL]
          if len(review_affiliate_links) != 3:
              raise RuntimeError(f"Expected exactly three Jotform affiliate CTAs on review page; found {len(review_affiliate_links)}.")

          for a in review_affiliate_links:
              rel_tokens = set((a.get("rel") or "").lower().split())
              if not {"sponsored", "noopener"}.issubset(rel_tokens):
                  raise RuntimeError("Review CTA missing sponsored/noopener.")
              if a.get("data-vendor") != "Jotform":
                  raise RuntimeError("Review CTA missing data-vendor=Jotform.")
              if a.get("target") != "_blank":
                  raise RuntimeError("Review CTA missing target=_blank.")

          if final_review.count("at no extra cost to you") < 3:
              raise RuntimeError("Each review-page affiliate CTA needs a nearby disclosure.")

          for required_text in [
              "Starter", "$34/mo", "$39/mo", "$99/mo", "1,000", "2,500", "10,000",
              "iOS", "Android", "offline", "Google Calendar", "Outlook", "Calendly",
              "electronic signatures", PRICING_URL, MOBILE_URL, APPOINTMENTS_URL, APPS_URL,
          ]:
              if required_text not in final_review:
                  raise RuntimeError(f"Jotform review validation missing: {required_text}")

          for source_url in [OFFICIAL_HOME, PRICING_URL, MOBILE_URL, APPOINTMENTS_URL, APPS_URL]:
              if source_url not in final_review:
                  raise RuntimeError(f"Official source missing: {source_url}")

          affiliate_count = 0
          for filename, text in changes.items():
              if not filename.endswith(".html") or AFFILIATE_URL not in text:
                  continue
              parsed = parse_html(text)
              for a in parsed.links:
                  if a.get("href") != AFFILIATE_URL:
                      continue
                  affiliate_count += 1
                  rel_tokens = set((a.get("rel") or "").lower().split())
                  if not {"sponsored", "noopener"}.issubset(rel_tokens):
                      raise RuntimeError(f"Missing sponsored/noopener in {filename}")
                  if a.get("data-vendor") != "Jotform":
                      raise RuntimeError(f"Missing Jotform data-vendor in {filename}")
                  if a.get("target") != "_blank":
                      raise RuntimeError(f"Missing target=_blank in {filename}")

          if review_path.exists() and review_path.name not in changes:
              for a in parsed_review.links:
                  if a.get("href") == AFFILIATE_URL:
                      affiliate_count += 1

          if affiliate_count < 4:
              raise RuntimeError(f"Expected multiple Jotform affiliate paths; found {affiliate_count}")

          final_sitemap = changes.get("sitemap.xml", original["sitemap.xml"])
          if final_sitemap.count(CANONICAL) != 1:
              raise RuntimeError(f"Jotform review URL must appear exactly once in sitemap; found {final_sitemap.count(CANONICAL)}.")
          ET.fromstring(final_sitemap)

          final_disclosure = changes.get("affiliate-disclosure.html", original["affiliate-disclosure.html"])
          if "Jotform affiliate relationship" not in final_disclosure:
              raise RuntimeError("Jotform affiliate relationship disclosure is missing.")

          if current("styles.css") != original["styles.css"]:
              raise RuntimeError("styles.css changed unexpectedly.")
          if current("app.js") != original["app.js"]:
              raise RuntimeError("app.js changed unexpectedly.")

          for filename in placements:
              if filename not in changes or filename not in original:
                  continue
              before = original[filename]
              after = changes[filename]
              if not after.startswith(before[: min(500, len(before))]):
                  raise RuntimeError(f"Unexpected rewrite detected in {filename}")
              ranked_match = re.search(r'(<ol class=["\']list["\']>[\s\S]*?</ol>)', before, flags=re.I)
              if ranked_match and ranked_match.group(1) not in after:
                  raise RuntimeError(f"Existing ranked list changed in {filename}")

          for filename, text in changes.items():
              write(filename, text)

          print("Written files:")
          for filename in sorted(changes):
              print(" -", filename)
          print(f"PASS: {affiliate_count} Jotform affiliate CTA(s) validated")
