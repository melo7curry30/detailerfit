name: DetailerFit - Add OnePageCRM Affiliate Revenue Paths

on:
  push:
    paths:
      - ".github/workflows/detailerfit-onepagecrm-affiliate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detailerfit-onepagecrm-affiliate
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Add OnePageCRM review and affiliate placements safely
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import re
          import xml.etree.ElementTree as ET

          ROOT = Path(".")
          AFFILIATE_URL = "https://www.onepagecrm.com/?via=3b521a"
          SLUG = "/onepagecrm-review-auto-detailers"
          CANONICAL = "https://getdetailerfit.com" + SLUG
          MARKER = "<!-- DETAILERFIT-ONEPAGECRM-V1 -->"
          DISCLOSURE_MARKER = "<!-- DETAILERFIT-ONEPAGECRM-DISCLOSURE-V1 -->"
          SOURCE_DATE = "September 15, 2026"
          ISO_DATE = "2026-09-15"

          OFFICIAL_HOME = "https://www.onepagecrm.com/"
          PRICING_URL = "https://www.onepagecrm.com/crm-pricing/"
          MOBILE_URL = "https://www.onepagecrm.com/features/mobile/"
          PLAN_SUMMARY_URL = "https://help.onepagecrm.com/article/883-legacy-users"

          REQUIRED = [
              "reviews.html",
              "affiliate-disclosure.html",
              "sitemap.xml",
              "styles.css",
              "app.js",
          ]
          OPTIONAL = [
              "best-crm-solo-mobile-detailers.html",
              "best-mobile-detailing-software.html",
              "best-auto-detailing-software-2026.html",
              "guides.html",
          ]

          for name in REQUIRED:
              if not (ROOT / name).is_file():
                  raise RuntimeError(f"Required file missing: {name}")

          def read(name):
              return (ROOT / name).read_text(encoding="utf-8")

          def write(name, text):
              (ROOT / name).write_text(text, encoding="utf-8")

          original = {name: read(name) for name in REQUIRED}
          for name in OPTIONAL:
              if (ROOT / name).is_file():
                  original[name] = read(name)

          changes = {}

          def current(name):
              if name in changes:
                  return changes[name]
              path = ROOT / name
              return path.read_text(encoding="utf-8") if path.is_file() else None

          def insert_before_last(text, closing_tag, addition):
              pos = text.lower().rfind(closing_tag.lower())
              if pos < 0:
                  raise RuntimeError(f"Required closing tag missing: {closing_tag}")
              return text[:pos] + addition + "\n" + text[pos:]

          def tracked_cta(label):
              return (
                  '<a class="btn primary" data-vendor="OnePageCRM" '
                  f'href="{AFFILIATE_URL}" rel="sponsored noopener" '
                  f'target="_blank">{label}</a>'
              )

          LOCAL_DISCLOSURE = (
              '<p class="cta-disclosure small">'
              'DetailerFit may earn a commission if you sign up through this link, '
              'at no extra cost to you. '
              '<a href="/affiliate-disclosure">Affiliate disclosure</a>.'
              '</p>'
          )

          # ------------------------------------------------------------
          # 1) Dedicated research-based review.
          #    Reuse current DetailerFit header/footer and shared CSS/JS.
          # ------------------------------------------------------------
          base = original["reviews.html"]
          header_match = re.search(r"<header\b[\s\S]*?</header>", base, flags=re.I)
          footer_match = re.search(r"<footer\b[\s\S]*?</footer>", base, flags=re.I)
          if not header_match or not footer_match:
              raise RuntimeError("Could not reuse current DetailerFit header/footer.")

          header = header_match.group(0)
          footer = footer_match.group(0)

          schema = {
              "@context": "https://schema.org",
              "@graph": [
                  {
                      "@type": "Article",
                      "@id": CANONICAL + "#article",
                      "headline": "OnePageCRM Review for Solo and Mobile Auto Detailers (2026)",
                      "description": (
                          "Research-based OnePageCRM review for solo and mobile auto detailers, "
                          "covering pricing, mobile CRM, Action Stream follow-up, automation, "
                          "sales pipeline fit, and limitations versus detailing-specific software."
                      ),
                      "dateModified": ISO_DATE,
                      "mainEntityOfPage": {
                          "@type": "WebPage",
                          "@id": CANONICAL,
                      },
                      "author": {
                          "@type": "Organization",
                          "name": "DetailerFit",
                          "url": "https://getdetailerfit.com/",
                      },
                      "publisher": {
                          "@type": "Organization",
                          "name": "DetailerFit",
                          "url": "https://getdetailerfit.com/",
                      },
                      "inLanguage": "en-US",
                  },
                  {
                      "@type": "BreadcrumbList",
                      "itemListElement": [
                          {
                              "@type": "ListItem",
                              "position": 1,
                              "name": "Home",
                              "item": "https://getdetailerfit.com/",
                          },
                          {
                              "@type": "ListItem",
                              "position": 2,
                              "name": "Reviews",
                              "item": "https://getdetailerfit.com/reviews",
                          },
                          {
                              "@type": "ListItem",
                              "position": 3,
                              "name": "OnePageCRM Review",
                              "item": CANONICAL,
                          },
                      ],
                  },
                  {
                      "@type": "FAQPage",
                      "mainEntity": [
                          {
                              "@type": "Question",
                              "name": "Is OnePageCRM a good CRM for a solo mobile detailer?",
                              "acceptedAnswer": {
                                  "@type": "Answer",
                                  "text": (
                                      "It can fit a solo detailer whose main need is lead follow-up, "
                                      "contact management and a simple sales pipeline. It is a general "
                                      "small-business sales CRM rather than detailing-specific job-management software."
                                  ),
                              },
                          },
                          {
                              "@type": "Question",
                              "name": "How much does OnePageCRM cost?",
                              "acceptedAnswer": {
                                  "@type": "Answer",
                                  "text": (
                                      "When checked September 15, 2026, OnePageCRM listed annual-plan "
                                      "rates of $9.95 per user/month for Professional, $19.95 for Business "
                                      "and $29.95 for Max. Month-to-month prices were $15, $29 and $45."
                                  ),
                              },
                          },
                          {
                              "@type": "Question",
                              "name": "Does OnePageCRM have mobile apps?",
                              "acceptedAnswer": {
                                  "@type": "Answer",
                                  "text": (
                                      "Yes. OnePageCRM publishes native Android and iOS apps with access "
                                      "to the Action Stream, contacts and sales pipeline."
                                  ),
                              },
                          },
                      ],
                  },
              ],
          }

          review = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#090d12">
          <title>OnePageCRM Review for Auto Detailers (2026) | DetailerFit</title>
          <meta name="description" content="Research-based OnePageCRM review for solo and mobile auto detailers: pricing, mobile CRM, follow-up workflow, automation, fit and limitations.">
          <link rel="canonical" href="{CANONICAL}">
          <link rel="stylesheet" href="/styles.css">
          <meta property="og:title" content="OnePageCRM Review for Auto Detailers (2026)">
          <meta property="og:description" content="Is OnePageCRM a good lightweight CRM for solo and mobile detailers? Research current pricing, mobile workflow, follow-up features and limitations.">
          <meta property="og:type" content="article">
          <meta property="og:url" content="{CANONICAL}">
          <meta name="twitter:card" content="summary">
          <script type="application/ld+json">{json.dumps(schema, separators=(",", ":"))}</script>
          </head>
          <body>
          <a class="skip-link" href="#main-content">Skip to content</a>
          {header}
          {MARKER}
          <main id="main-content" tabindex="-1">

          <section class="heroMini"><div class="wrap">
          <div class="breadcrumbs"><a href="/">Home</a> / <a href="/reviews">Reviews</a> / OnePageCRM</div>
          <span class="eyebrow">LIGHTWEIGHT SALES CRM · RESEARCH-BASED · {SOURCE_DATE}</span>
          <h1>OnePageCRM Review for Solo &amp; Mobile Auto Detailers</h1>
          <p class="lead">OnePageCRM is a general small-business sales CRM built around one question: what is the next action for this lead or customer? For detailers, its strongest use case is simple lead follow-up and pipeline discipline—not replacing detailing-specific booking, estimating, vehicle or job-management software.</p>
          <div class="actions">
          {tracked_cta("Try OnePageCRM Free")}
          <a class="btn secondary" href="/best-crm-solo-mobile-detailers">Compare Mobile Detailing CRMs</a>
          </div>
          {LOCAL_DISCLOSURE}
          </div></section>

          <section class="section"><div class="wrap article">
          <aside class="research-context research-block" aria-label="Research transparency">
          <details open>
          <summary>Research-based · Source check: {SOURCE_DATE} · How we researched this</summary>
          <div><strong>Research basis</strong><span>Current OnePageCRM product, pricing, mobile-app and help documentation.</span></div>
          <div><strong>Hands-on testing</strong><span>Not claimed for this review.</span></div>
          <div><strong>Positioning</strong><span>OnePageCRM is evaluated as a lightweight general sales CRM, not as automotive-specific operating software.</span></div>
          <p><a href="/methodology">How we review software</a> · <a href="/affiliate-disclosure">Affiliate disclosure</a>.</p>
          </details>
          </aside>

          <h2>Quick verdict</h2>
          <div class="verdict">
          <p><strong>Best fit:</strong> solo and small mobile detailers who mainly need a clean lead list, consistent follow-up, contact history and a simple sales pipeline.</p>
          <p><strong>Look elsewhere first if:</strong> your priority is customer self-booking, vehicle-specific estimates, inspections, work orders, deposits, payments or a full detailing shop operating system.</p>
          </div>

          <h2>What OnePageCRM is</h2>
          <p>OnePageCRM calls itself an action-focused CRM for small businesses. Its core Action Stream assigns a Next Action to contacts so open leads and customers keep moving instead of disappearing into a database. The product also includes contact management, deal pipelines, email and call tools, workflow automation and mobile apps.</p>

          <h2>Current pricing</h2>
          <p>The current pricing page shows four months free on annual plans. The figures below separate the annual-plan monthly equivalent from the month-to-month price so the comparison is not misleading.</p>
          <div class="tablewrap" role="region" tabindex="0" aria-label="OnePageCRM pricing">
          <table>
          <thead><tr><th>Plan</th><th>Annual-plan rate</th><th>Month-to-month</th><th>Published positioning</th></tr></thead>
          <tbody>
          <tr><td>Professional</td><td>$9.95/user/mo</td><td>$15/user/mo</td><td>Core lead and sales organization</td></tr>
          <tr><td>Business</td><td>$19.95/user/mo</td><td>$29/user/mo</td><td>Email tracking and project-oriented features</td></tr>
          <tr><td>Max</td><td>$29.95/user/mo</td><td>$45/user/mo</td><td>AI integrations, sequences and unlimited automation</td></tr>
          </tbody>
          </table>
          </div>
          <p class="small">Pricing checked {SOURCE_DATE}. OnePageCRM also advertises a 21-day free trial with no credit card required. Confirm current checkout pricing and plan limits before subscribing.</p>

          <h2>Why it can make sense for a mobile detailer</h2>
          <h3>1. Follow-up is the product's center of gravity</h3>
          <p>A mobile detailer can use Next Actions for quote follow-up, coating consultations, fleet leads, rebooking reminders and customers who need a call next week rather than another complicated dashboard.</p>

          <h3>2. The mobile app matters in the field</h3>
          <p>OnePageCRM publishes native Android and iOS apps. The mobile experience includes the Action Stream, contact view and sales pipeline, plus call logging and mobile notifications. That is relevant for operators who spend most of the day away from a desk.</p>

          <h3>3. Core CRM capacity is generous</h3>
          <p>The current pricing table lists unlimited contacts, deals, custom fields and tags across plans. Workflow automation is also available across the lineup, with published limits of 15 Autoflows on Professional, 30 on Business and unlimited on Max.</p>

          <h2>Where it is weaker for detailing</h2>
          <p>OnePageCRM is not marketed as detailing software. The official product pages focus on sales pipeline, contacts, follow-up, email, automation and mobile selling. A detailer who needs vehicle records, service menus, inspection photos, deposits, route/job dispatch, invoicing or customer self-booking should verify integrations or compare a detailing-native / field-service platform first.</p>

          <h2>Best OnePageCRM plan for a solo detailer</h2>
          <p><strong>Professional</strong> is the logical starting point if the goal is simply to stop losing leads and create consistent follow-up. <strong>Business</strong> becomes more relevant if email scheduling/open tracking and additional workflow capacity matter. <strong>Max</strong> is harder to justify for a one-person shop unless email sequences, AI integrations or unlimited automation are part of the growth plan.</p>

          <div class="actions">
          {tracked_cta("Start the 21-Day Trial")}
          <a class="btn secondary" href="/finder">Use the Software Finder</a>
          </div>
          {LOCAL_DISCLOSURE}

          <h2>OnePageCRM vs a detailing-specific CRM</h2>
          <div class="tablewrap" role="region" tabindex="0" aria-label="OnePageCRM versus detailing CRM">
          <table>
          <thead><tr><th>Need</th><th>OnePageCRM</th><th>Detailing-specific CRM</th></tr></thead>
          <tbody>
          <tr><td>Lead follow-up</td><td><strong>Core strength</strong></td><td>Usually included</td></tr>
          <tr><td>Simple sales pipeline</td><td><strong>Core strength</strong></td><td>Usually included</td></tr>
          <tr><td>Mobile CRM access</td><td><strong>Native iOS + Android</strong></td><td>Varies</td></tr>
          <tr><td>Vehicle-specific workflow</td><td>General custom fields / CRM structure</td><td><strong>Usually stronger</strong></td></tr>
          <tr><td>Detailing booking + service logic</td><td>Not the core product positioning</td><td><strong>Usually stronger</strong></td></tr>
          <tr><td>Shop operations</td><td>Sales-first</td><td><strong>Usually stronger</strong></td></tr>
          </tbody>
          </table>
          </div>

          <h2>Official sources</h2>
          <div class="sourcebox">
          <a href="{OFFICIAL_HOME}" rel="noopener" target="_blank">OnePageCRM — Official site</a><br>
          <a href="{PRICING_URL}" rel="noopener" target="_blank">OnePageCRM — Pricing</a><br>
          <a href="{MOBILE_URL}" rel="noopener" target="_blank">OnePageCRM — Mobile CRM</a><br>
          <a href="{PLAN_SUMMARY_URL}" rel="noopener" target="_blank">OnePageCRM Help — Plan summary</a>
          </div>
          <p class="small">Source check: {SOURCE_DATE}. Features, automation limits, pricing and integrations can change. Verify current terms directly with OnePageCRM before purchase.</p>

          <h2>Final check before subscribing</h2>
          <p>Run a real week of leads through the free trial: a basic detail inquiry, a ceramic coating quote, one lead that needs a follow-up in three days, and one customer you want to rebook later. If the Next Action workflow keeps those opportunities visible without adding admin friction, OnePageCRM may be a strong lightweight layer. If you immediately need booking, estimating, vehicle records and payments in the same system, compare specialist platforms first.</p>

          <div class="actions">
          {tracked_cta("Try OnePageCRM")}
          <a class="btn secondary" href="/best-crm-solo-mobile-detailers">Compare CRM Options</a>
          </div>
          {LOCAL_DISCLOSURE}
          </div></section>
          </main>
          {footer}
          <script src="/app.js"></script>
          </body>
          </html>
          """

          review_path = ROOT / "onepagecrm-review-auto-detailers.html"
          if review_path.exists():
              existing = read(review_path.name)
              if MARKER not in existing:
                  raise RuntimeError(
                      "onepagecrm-review-auto-detailers.html already exists without the DetailerFit marker."
                  )
              # Preserve an already-applied generated page.
          else:
              changes[review_path.name] = review

          # ------------------------------------------------------------
          # 2) Additive placements on pages where a lightweight sales CRM
          #    is genuinely relevant. Do not alter existing rankings.
          # ------------------------------------------------------------
          placements = {
              "reviews.html": (
                  "LIGHTWEIGHT SALES CRM",
                  "OnePageCRM for solo detailers",
                  "OnePageCRM is a general small-business sales CRM centered on Next Actions, contact follow-up and deal pipelines. It is most relevant when lead discipline matters more than automotive-specific job operations.",
                  "Read the OnePageCRM review",
              ),
              "best-crm-solo-mobile-detailers.html": (
                  "ALSO CONSIDER · SIMPLE CRM",
                  "OnePageCRM for follow-up-first solo operators",
                  "OnePageCRM is worth a separate look if your biggest CRM problem is remembering the next follow-up, not booking, invoicing or vehicle-specific job management. It is not added to the ranked list above and is not presented as detailing-specific software.",
                  "Evaluate OnePageCRM",
              ),
              "best-mobile-detailing-software.html": (
                  "ALSO CONSIDER · SALES FOLLOW-UP",
                  "A lightweight CRM layer for mobile detailers",
                  "OnePageCRM can fit operators who already have booking/payment tools but want a simpler place to manage leads, follow-ups and sales opportunities from a phone. This placement does not change the ranked software picks above.",
                  "See the OnePageCRM review",
              ),
              "best-auto-detailing-software-2026.html": (
                  "ALSO CONSIDER · LEAD FOLLOW-UP",
                  "OnePageCRM when the sales pipeline is the bottleneck",
                  "OnePageCRM is a general sales CRM rather than a detailing operating system. Consider it separately when missed follow-ups are the main problem and your current stack already handles booking, jobs and payments.",
                  "Research OnePageCRM",
              ),
              "guides.html": (
                  "CRM REVIEW",
                  "OnePageCRM for solo & mobile detailers",
                  "Research OnePageCRM as a lightweight sales CRM for lead follow-up, mobile contact management and simple pipeline discipline.",
                  "Read the OnePageCRM review",
              ),
          }

          for filename, (kicker, heading, paragraph, label) in placements.items():
              if not (ROOT / filename).is_file():
                  continue

              text = current(filename)
              page_marker = f"{MARKER}-{filename}"
              if page_marker in text:
                  continue

              block = f"""
          {page_marker}
          <section class="section tight" aria-labelledby="onepagecrm-option-{filename.replace('.', '-')}">
          <div class="wrap article"><div class="card">
          <div class="kicker">{kicker}</div>
          <h2 id="onepagecrm-option-{filename.replace('.', '-')}">{heading}</h2>
          <p>{paragraph}</p>
          <p class="small">Research checked {SOURCE_DATE}. OnePageCRM is a general small-business sales CRM, not automotive-specific operating software.</p>
          <div class="actions">
          <a class="btn secondary" href="{SLUG}">{label}</a>
          {tracked_cta("Visit OnePageCRM")}
          </div>
          {LOCAL_DISCLOSURE}
          </div></div></section>
          """
              changes[filename] = insert_before_last(text, "</main>", block)

          # ------------------------------------------------------------
          # 3) Affiliate disclosure — additive relationship note.
          # ------------------------------------------------------------
          disclosure = current("affiliate-disclosure.html")
          if DISCLOSURE_MARKER not in disclosure:
              disclosure_block = f"""
          {DISCLOSURE_MARKER}
          <section class="section tight" aria-labelledby="onepagecrm-affiliate-relationship">
          <div class="wrap article"><div class="note">
          <h2 id="onepagecrm-affiliate-relationship">OnePageCRM affiliate relationship</h2>
          <p>DetailerFit participates in the OnePageCRM affiliate program and may earn a commission from qualifying paid subscriptions made through clearly marked OnePageCRM affiliate links, at no extra cost to the reader. Affiliate compensation does not buy ranking position or change our editorial conclusions.</p>
          </div></div></section>
          """
              changes["affiliate-disclosure.html"] = insert_before_last(
                  disclosure, "</main>", disclosure_block
              )

          # ------------------------------------------------------------
          # 4) Sitemap — add dedicated review once.
          # ------------------------------------------------------------
          sitemap = current("sitemap.xml")
          ET.fromstring(sitemap)
          locs = re.findall(r"<loc>\s*(.*?)\s*</loc>", sitemap, flags=re.I)
          if CANONICAL not in locs:
              sitemap = insert_before_last(
                  sitemap,
                  "</urlset>",
                  f"  <url><loc>{CANONICAL}</loc><lastmod>{ISO_DATE}</lastmod></url>",
              )
              ET.fromstring(sitemap)
              changes["sitemap.xml"] = sitemap

          # ------------------------------------------------------------
          # 5) Validation.
          # ------------------------------------------------------------
          class Elements(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.canonicals = []
                  self.h1_count = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == "a":
                      self.links.append(attrs)
                  elif tag == "link" and attrs.get("rel") == "canonical":
                      self.canonicals.append(attrs.get("href"))
                  elif tag == "h1":
                      self.h1_count += 1

          def parse_html(text):
              parser = Elements()
              parser.feed(text)
              return parser

          final_review = changes.get(
              review_path.name,
              review_path.read_text(encoding="utf-8") if review_path.exists() else "",
          )
          parsed_review = parse_html(final_review)

          if parsed_review.canonicals != [CANONICAL]:
              raise RuntimeError("OnePageCRM review canonical is invalid.")
          if parsed_review.h1_count != 1:
              raise RuntimeError("OnePageCRM review must contain exactly one H1.")

          review_affiliate_links = [
              a for a in parsed_review.links if a.get("href") == AFFILIATE_URL
          ]
          if len(review_affiliate_links) != 3:
              raise RuntimeError(
                  f"Expected exactly three OnePageCRM affiliate CTAs on review page; "
                  f"found {len(review_affiliate_links)}."
              )

          for a in review_affiliate_links:
              rel_tokens = set((a.get("rel") or "").lower().split())
              if not {"sponsored", "noopener"}.issubset(rel_tokens):
                  raise RuntimeError("Review CTA missing sponsored/noopener.")
              if a.get("data-vendor") != "OnePageCRM":
                  raise RuntimeError("Review CTA missing data-vendor=OnePageCRM.")
              if a.get("target") != "_blank":
                  raise RuntimeError("Review CTA missing target=_blank.")

          if final_review.count("at no extra cost to you") < 3:
              raise RuntimeError("Each review-page affiliate CTA needs a nearby disclosure.")

          for required_text in [
              "$9.95",
              "$19.95",
              "$29.95",
              "$15",
              "$29",
              "$45",
              "21-day free trial",
              "Next Action",
              "Android",
              "iOS",
              "15 Autoflows",
              "30 on Business",
              "unlimited on Max",
              PRICING_URL,
              MOBILE_URL,
              PLAN_SUMMARY_URL,
          ]:
              if required_text not in final_review:
                  raise RuntimeError(f"OnePageCRM review validation missing: {required_text}")

          # Official source URLs must be editorial/untracked on the review page.
          for source_url in [OFFICIAL_HOME, PRICING_URL, MOBILE_URL, PLAN_SUMMARY_URL]:
              if source_url not in final_review:
                  raise RuntimeError(f"Official source missing: {source_url}")

          # Validate every OnePageCRM tracked link in resulting changed HTML.
          affiliate_count = 0
          for filename, text in changes.items():
              if not filename.endswith(".html") or AFFILIATE_URL not in text:
                  continue
              parsed = parse_html(text)
              for a in parsed.links:
                  if a.get("href") != AFFILIATE_URL:
                      continue
                  affiliate_count += 1
                  rel_tokens = set((a.get("rel") or "").lower().split())
                  if not {"sponsored", "noopener"}.issubset(rel_tokens):
                      raise RuntimeError(f"Missing sponsored/noopener in {filename}")
                  if a.get("data-vendor") != "OnePageCRM":
                      raise RuntimeError(f"Missing OnePageCRM data-vendor in {filename}")
                  if a.get("target") != "_blank":
                      raise RuntimeError(f"Missing target=_blank in {filename}")

          # If review already existed and is not in changes, count it too.
          if review_path.exists() and review_path.name not in changes:
              for a in parsed_review.links:
                  if a.get("href") == AFFILIATE_URL:
                      affiliate_count += 1

          if affiliate_count < 4:
              raise RuntimeError(
                  f"Expected multiple OnePageCRM affiliate paths; found {affiliate_count}"
              )

          final_sitemap = changes.get("sitemap.xml", original["sitemap.xml"])
          if final_sitemap.count(CANONICAL) != 1:
              raise RuntimeError(
                  f"OnePageCRM review URL must appear exactly once in sitemap; "
                  f"found {final_sitemap.count(CANONICAL)}."
              )
          ET.fromstring(final_sitemap)

          final_disclosure = changes.get(
              "affiliate-disclosure.html",
              original["affiliate-disclosure.html"],
          )
          if "OnePageCRM affiliate relationship" not in final_disclosure:
              raise RuntimeError("OnePageCRM affiliate relationship disclosure is missing.")

          # Shared design/behavior assets must remain untouched.
          if current("styles.css") != original["styles.css"]:
              raise RuntimeError("styles.css changed unexpectedly.")
          if current("app.js") != original["app.js"]:
              raise RuntimeError("app.js changed unexpectedly.")

          # Existing rankings are protected because all guide placements are
          # additive blocks immediately before </main>.
          for filename in placements:
              if filename not in changes or filename not in original:
                  continue
              before = original[filename]
              after = changes[filename]
              if not after.startswith(before[: min(500, len(before))]):
                  raise RuntimeError(f"Unexpected rewrite detected in {filename}")
              # Existing ranked list text, when present, must survive verbatim.
              ranked_match = re.search(
                  r'(<ol class=["\']list["\']>[\s\S]*?</ol>)',
                  before,
                  flags=re.I,
              )
              if ranked_match and ranked_match.group(1) not in after:
                  raise RuntimeError(f"Existing ranked list changed in {filename}")

          # Write only after validation succeeds.
          for filename, text in changes.items():
              write(filename, text)

          print("Written files:")
          for filename in sorted(changes):
              print(" -", filename)
          print(f"PASS: {affiliate_count} OnePageCRM affiliate CTA(s) validated")
          print("PASS: rel=sponsored noopener + data-vendor=OnePageCRM + target=_blank")
          print("PASS: dedicated review + current pricing + mobile CRM sources")
          print("PASS: existing ranked picks preserved; guide placements are additive")
          print("PASS: affiliate disclosure + sitemap")
          print("UNCHANGED: styles.css and app.js")

      - name: Commit website changes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            onepagecrm-review-auto-detailers.html \
            reviews.html \
            affiliate-disclosure.html \
            sitemap.xml

          for f in \
            best-crm-solo-mobile-detailers.html \
            best-mobile-detailing-software.html \
            best-auto-detailing-software-2026.html \
            guides.html
          do
            if [ -f "$f" ]; then
              git add -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new changes. OnePageCRM implementation already exists."
            exit 0
          fi

          git diff --cached --check
          git commit -m "Add OnePageCRM review and affiliate revenue paths"
          git push origin "HEAD:${TARGET_BRANCH}"

