name: DetailerFit - QuoteIQ September 2026 Update FIX

on:
  push:
    paths:
      - ".github/workflows/detailerfit-quoteiq-september-2026-fixed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Patch current DetailerFit source
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          R=Path(".")
          WF=R/".github/workflows/detailerfit-quoteiq-september-2026-fixed.yml"
          OLD_WF=R/".github/workflows/detailerfit-quoteiq-september-2026.yml"
          TODAY="2026-09-18"
          HUMAN="September 18, 2026"
          AFF="https://admin-quoteiq.web.app/register?via=ryo"
          MARK="DETAILERFIT-QUOTEIQ-SEP18-2026"

          def rd(p): return (R/p).read_text(encoding="utf-8")
          def wr(p,s): (R/p).write_text(s,encoding="utf-8")
          def add_before_main(p, marker, block):
              if not (R/p).is_file(): return
              s=rd(p)
              a=f"<!-- {marker}:START -->"; b=f"<!-- {marker}:END -->"
              w=f"{a}\n{block}\n{b}"
              if a in s and b in s:
                  s=re.sub(re.escape(a)+r"[\s\S]*?"+re.escape(b),w,s,count=1)
              else:
                  i=s.lower().rfind("</main>")
                  if i<0: raise SystemExit(f"{p}: missing </main>")
                  s=s[:i]+w+"\n"+s[i:]
              wr(p,s)

          for f in ["quoteiq.html","styles.css","app.js","sitemap.xml"]:
              if not (R/f).is_file(): raise SystemExit(f"Missing {f}")

          css0,js0=rd("styles.css"),rd("app.js")
          q0=rd("quoteiq.html")
          aff0=q0.count(AFF)
          q=q0

          q=re.sub(r'("dateModified"\s*:\s*")\d{4}-\d{2}-\d{2}(")',rf'\g<1>{TODAY}\2',q,count=1)
          q=q.replace("VERIFIED SEP 8, 2026","VERIFIED SEP 18, 2026")
          q=q.replace("Source check: Sep 8, 2026","Source check: Sep 18, 2026")
          q=q.replace("September 8, 2026","September 18, 2026")

          q=q.replace(
            '<div class="fact"><span>CUSTOMER BOOKING</span><b>Elite · $299/mo</b></div>',
            '<div class="fact"><span>ONLINE BOOKING</span><b>All plans</b></div>')
          q=q.replace(
            "If customer self-booking, route optimization or employee operations are must-haves, evaluate Elite at $299/month rather than judging QuoteIQ by the $29.99 entry tier.",
            "QuoteIQ's September matrix now lists Online Booking & Self-Scheduling on every plan. Evaluate Pro for Client Portal Self-Scheduling, and Elite when InstaQuote, automatic route optimization or EmployeeHub are the real requirement.")
          q=q.replace(
            "Its biggest pricing trade-off is that several operational features a growing detailing business may value most — especially customer self-booking and routing — begin on Elite.",
            "Its September update improves low-tier value because online booking/self-scheduling is now listed across all plans, while advanced portal, InstaQuote, automatic routing and employee workflows still move up the plan ladder.")

          if MARK not in q:
              block=f'''<!-- {MARK}:START -->
          <section class="section tight" aria-label="QuoteIQ September 2026 update"><div class="wrap article">
          <div class="callout"><div>
          <div class="kicker">SEPTEMBER 2026 PRODUCT UPDATE</div>
          <h2>QuoteIQ changed its booking, calendar and AI feature matrix</h2>
          <p><strong>Main correction:</strong> QuoteIQ's current pricing matrix lists <strong>Online Booking &amp; Self-Scheduling on every plan</strong>. It separately lists <strong>Client Portal Self-Scheduling from Pro</strong>.</p>
          <ul>
          <li><strong>Google Calendar:</strong> rebuilt sync is listed from Beginner upward and uses IQ Credits per event.</li>
          <li><strong>Routing:</strong> road distances between stops are listed across plans; automatic route optimization remains Elite/Max.</li>
          <li><strong>AI connectivity:</strong> connecting a compatible assistant to QuoteIQ is listed across plans, with platform-availability caveats.</li>
          <li><strong>Advanced quoting:</strong> InstaQuote remains Elite/Max.</li>
          </ul>
          <p class="small">Verified {HUMAN} against QuoteIQ's official pricing matrix. The QuoteIQ affiliate relationship does not change DetailerFit's editorial standard.</p>
          </div></div></div></section>
          <!-- {MARK}:END -->'''
              anchor="</details></aside>"
              i=q.find(anchor)
              if i<0: raise SystemExit("quoteiq.html: research box not found")
              i+=len(anchor); q=q[:i]+"\n"+block+q[i:]

          q=q.replace(
            "Features such as <strong>InstaSchedule customer self-booking, route optimization and EmployeeHub</strong> begin on <strong>Elite at $299/month</strong>.",
            "QuoteIQ's September matrix lists <strong>Online Booking &amp; Self-Scheduling on every plan</strong>. <strong>Client Portal Self-Scheduling starts on Pro</strong>, while <strong>InstaQuote, automatic route optimization and EmployeeHub</strong> remain higher-tier workflows.")
          q=q.replace("<td>Self-booking, routing and employee operations</td>",
                      "<td>InstaQuote, routing and employee operations</td>")
          q=q.replace(
            "Beginner adds QuoteIQ Cam, inspection forms and related job-documentation tools, along with a larger user allowance and more IQ Credits.",
            "Beginner adds QuoteIQ Cam, inspection forms and related job-documentation tools, along with a larger user allowance, more IQ Credits and the rebuilt Google Calendar sync listed from Beginner upward.")
          q=q.replace(
            'Pro adds ClientHub, email and text automation, "On The Way" notifications, website contact forms, a client portal, job costing and QuickBooks Online integration.',
            'Pro adds ClientHub, email and text automation, "On The Way" notifications, website contact forms, a client portal, Client Portal Self-Scheduling, job costing and QuickBooks Online integration.')
          q=q.replace(
            "Elite is the first plan with InstaQuote, InstaSchedule customer self-booking, mass campaigns, pipelines, inventory management, route optimization, route density tools and EmployeeHub. For a mobile detailing team that wants customers to book themselves or wants routing and employee operations inside QuoteIQ, Elite is the key comparison point.",
            "Elite remains the first plan with InstaQuote, automatic route optimization, mass campaigns, pipelines, inventory management, route-density tools and EmployeeHub. Basic Online Booking & Self-Scheduling is now listed across all plans, while Client Portal Self-Scheduling starts on Pro.")
          q=q.replace(
            '<div class="warning"><b>Important distinction:</b> internal scheduling is not the same as customer self-booking. Every plan includes scheduling and calendar tools, but InstaSchedule customer self-booking starts on Elite.</div>',
            '<div class="warning"><b>September 2026 distinction:</b> QuoteIQ now lists Online Booking &amp; Self-Scheduling across all plans. Client Portal Self-Scheduling starts on Pro; automatic route optimization and InstaQuote remain higher-tier features.</div>')

          sec='''<h2 id="section-5">Online booking and self-scheduling: the September 2026 boundary changed</h2>
          <p>QuoteIQ's current pricing matrix lists <strong>Online Booking &amp; Self-Scheduling on Essentials, Beginner, Pro, Elite and Max</strong>. That materially improves the low-tier booking value versus DetailerFit's earlier September research.</p>
          <p>The same matrix separately lists <strong>Client Portal Self-Scheduling from Pro</strong>. DetailerFit therefore treats basic online booking/self-scheduling and portal-based self-scheduling as different plan gates.</p>
          <p><strong>What still starts higher:</strong> InstaQuote and automatic route optimization are listed on Elite and Max.</p>
          <p><a href="/mobile-detailing-scheduling-software">Compare scheduling and booking options across detailing software →</a></p>
          '''
          q,n=re.subn(r'<h2 id="section-5">Customer self-booking: the most important plan boundary</h2>[\s\S]*?(?=<h2 id="section-6">)',sec,q,count=1)
          if n!=1: raise SystemExit("quoteiq.html: booking section replacement failed")

          if "September AI update:" not in q:
              a='<div class="note"><b>Buying implication:</b>'
              i=q.find(a)
              if i<0: raise SystemExit("quoteiq.html: AI anchor missing")
              q=q[:i]+'''<p><strong>September AI update:</strong> QuoteIQ's current matrix lists the ability to connect a compatible assistant across plans, but tells buyers to check current platform availability. Treat this as rollout-sensitive rather than guaranteed universal access.</p>
          '''+q[i:]

          q=q.replace(
            "Elite adds the operational features most relevant to a larger mobile team: route optimization, route density tools, EmployeeHub, GPS-related employee tools, time tracking, team communication, inventory and pipelines.",
            "Elite still adds automatic route optimization, route-density tools, EmployeeHub, GPS-related employee tools, time tracking, team communication, inventory and pipelines. The September matrix separately lists road distances between stops across all plans.")
          q=q.replace(
            "A one-person operation can access the core system at a low price; a larger team that wants routing, self-booking and employee operations is evaluating a much higher monthly tier.",
            "A one-person operation can now evaluate core CRM plus published online booking/self-scheduling at the low end; automatic routing, InstaQuote and employee operations still push the comparison toward Elite.")
          q=q.replace(
            "<li><strong>Customer self-booking starts high in the plan ladder:</strong> InstaSchedule begins on Elite at $299/month.</li>",
            "<li><strong>Advanced self-service is split across tiers:</strong> basic Online Booking &amp; Self-Scheduling is listed across all plans, Client Portal Self-Scheduling starts on Pro, and InstaQuote remains Elite/Max.</li>")
          q=q.replace(
            "For a solo detailer who does not need customer self-booking, Essentials is the clearest starting point. For a growing business that wants automation and job-cost visibility, inspect Pro. For self-booking, routing and employee operations, evaluate Elite directly.",
            "For a solo detailer, Essentials is more compelling because online booking/self-scheduling is now listed across all plans. For client-portal self-scheduling, automation and job-cost visibility, inspect Pro. For InstaQuote, automatic routing and employee operations, inspect Elite.")

          q,n=re.subn(r'(<h3>Does QuoteIQ include customer self-booking\?</h3>\s*<p>)[\s\S]*?(</p>)',
                      r"\1Yes. QuoteIQ's September 2026 pricing matrix lists Online Booking &amp; Self-Scheduling on every plan. Client Portal Self-Scheduling starts on Pro; InstaQuote and automatic route optimization remain higher-tier features.\2",q,count=1)
          if n!=1: raise SystemExit("quoteiq.html: visible FAQ update failed")

          q=q.replace(
            '''"acceptedAnswer":{"@type":"Answer","text":"Customer self-booking uses InstaSchedule and is available on Elite and Max. Lower plans include internal scheduling and calendar tools but not InstaSchedule customer self-booking."}''',
            '''"acceptedAnswer":{"@type":"Answer","text":"QuoteIQ's September 2026 pricing matrix lists Online Booking & Self-Scheduling on every plan. Client Portal Self-Scheduling starts on Pro; InstaQuote and automatic route optimization remain higher-tier features."}''')

          q=re.sub(r'<meta name="description" content="[^"]+">',
                   '<meta name="description" content="Updated September 2026 QuoteIQ review for mobile detailers: pricing, online booking, Google Calendar sync, AI connectivity, routing, IQ Credits and plan fit.">',q,count=1)
          wr("quoteiq.html",q)

          reps={
          "quoteiq-pricing-mobile-detailing.html":[
            ("Elite is the first tier with customer self-booking and route optimization.",
             "QuoteIQ's September matrix lists Online Booking & Self-Scheduling on every plan; Client Portal Self-Scheduling starts on Pro, while automatic route optimization and InstaQuote remain Elite/Max."),
            ("Team that needs self-booking, routing and employee operations","Team that needs InstaQuote, routing and employee operations"),
            ("The important limitation: Essentials does not include a customer-facing self-booking link. If you are happy to confirm appointments yourself, that may not matter. If your goal is to let customers book directly against your live availability, you need Elite or Max.",
             "September 2026 update: the current matrix lists Online Booking & Self-Scheduling on Essentials. Client Portal Self-Scheduling starts on Pro; automatic route optimization and InstaQuote remain Elite/Max."),
            ("### Elite — customer self-booking, routes and team operations","### Elite — InstaQuote, routes and team operations"),
            ("Elite is $299/month and is the first plan that includes InstaSchedule, QuoteIQ's customer-facing online booking feature. It also adds InstaQuote, automated review requests, mass campaigns, pipelines, inventory, route optimization, route-density tools and EmployeeHub features such as GPS tracking and time tracking.",
             "Elite is $299/month and remains the first tier for InstaQuote, automatic route optimization, mass campaigns, pipelines, inventory, route-density tools and EmployeeHub. Basic Online Booking & Self-Scheduling is now listed across all plans; Client Portal Self-Scheduling starts on Pro."),
            ("If customer self-booking is essential, for example, your real comparison point is Elite at $299/month—not Essentials at $29.99. If automated follow-up and job costing are essential, Pro at $149.99 is the more relevant tier.",
             "If basic online booking/self-scheduling is essential, Essentials now belongs in the comparison. If Client Portal Self-Scheduling, follow-up and job costing are essential, inspect Pro. If automatic routing or InstaQuote is essential, inspect Elite.")
          ],
          "mobile-detailing-scheduling-software.html":[
            ("customer self-booking through InstaSchedule begins on Elite at $299/month",
             "QuoteIQ's current matrix lists Online Booking & Self-Scheduling across all plans; Client Portal Self-Scheduling starts on Pro, while automatic route optimization and InstaQuote remain Elite/Max"),
            ("Essentials, Beginner and Pro include internal scheduling but do not include a customer booking link that schedules directly against live availability.",
             "The September matrix now separates basic online booking/self-scheduling from Client Portal Self-Scheduling and Elite-level routing/InstaQuote workflows."),
            ("If your requirement is “I need customers to book themselves online,” the correct price comparison jumps to Elite.",
             "If your requirement is basic online booking/self-scheduling, Essentials now belongs in the comparison. Client Portal Self-Scheduling starts on Pro; automatic routing and InstaQuote start on Elite."),
            ("First QuoteIQ tier with InstaSchedule and route optimization","First QuoteIQ tier with automatic route optimization and InstaQuote"),
            ("QuoteIQ Essentials is a lower-cost option for internal scheduling, but customer self-booking requires Elite.",
             "QuoteIQ Essentials is a lower-cost option whose September matrix now also lists Online Booking & Self-Scheduling; Client Portal Self-Scheduling starts on Pro."),
            ("No. QuoteIQ Essentials includes internal job scheduling and a calendar, but customer self-booking through InstaSchedule starts on Elite at $299 per month.",
             "Yes. QuoteIQ's September 2026 pricing matrix lists Online Booking & Self-Scheduling on Essentials. Client Portal Self-Scheduling starts on Pro; automatic route optimization and InstaQuote remain higher-tier.")
          ],
          "quoteiq-vs-urable.html":[
            ("QuoteIQ's customer-facing self-booking feature, InstaSchedule, starts on Elite at $299/month. Lower QuoteIQ plans still include internal scheduling, and Pro adds website contact forms and a client portal, but customers cannot book themselves into live availability until Elite or Max.",
             "QuoteIQ's September 2026 pricing matrix lists Online Booking & Self-Scheduling across all plans and Client Portal Self-Scheduling from Pro. Automatic route optimization and InstaQuote remain Elite/Max."),
            ("QuoteIQ customer self-booking through InstaSchedule begins on Elite at $299/month.",
             "QuoteIQ's current matrix lists Online Booking & Self-Scheduling across all plans; Client Portal Self-Scheduling starts on Pro."),
            ("<td>Elite, $299/mo</td><td>Pro, $110/mo</td><td>Urable</td>",
             "<td>Online booking: all plans; portal self-scheduling: Pro+</td><td>Pro, $110/mo</td><td>Depends on workflow</td>")
          ],
          "quoteiq-vs-servicem8-mobile-detailers.html":[
            ("QuoteIQ includes its internal job scheduling and calendar on Essentials, but customer-facing self-booking through InstaSchedule starts on Elite at $299/month. That is the first QuoteIQ tier that lets customers book themselves against real-time availability.",
             "QuoteIQ's September 2026 matrix lists Online Booking & Self-Scheduling on Essentials and Client Portal Self-Scheduling from Pro. Automatic route optimization and InstaQuote remain higher-tier."),
            ("ServiceM8 lists Online Bookings on all plans. QuoteIQ customer self-booking starts with InstaSchedule on Elite at $299/month.",
             "ServiceM8 lists Online Bookings on all plans. QuoteIQ's current matrix also lists Online Booking & Self-Scheduling across all plans, with Client Portal Self-Scheduling from Pro.")
          ],
          "best-crm-solo-mobile-detailers.html":[
            ("No. QuoteIQ Essentials includes an internal calendar and scheduling. Current 2026 documentation says\n    customer self-booking through InstaSchedule starts on Elite at $299/month.",
             "Yes. QuoteIQ's September 2026 pricing matrix lists Online Booking & Self-Scheduling on Essentials. Client Portal Self-Scheduling starts on Pro; automatic route optimization and InstaQuote remain higher-tier.")
          ],
          "quoteiq-alternatives-mobile-detailing.html":[
            ("But some important workflows arrive later: customer self-booking through InstaSchedule and route optimization begin on Elite at $299/month.",
             "The September 2026 matrix improves the low-tier proposition: Online Booking & Self-Scheduling is listed across all plans and Client Portal Self-Scheduling from Pro. Automatic route optimization and InstaQuote remain Elite/Max.")
          ]}

          for f,items in reps.items():
              if not (R/f).is_file(): continue
              s=rd(f)
              s=re.sub(r'("dateModified"\s*:\s*")\d{4}-\d{2}-\d{2}(")',rf'\g<1>{TODAY}\2',s,count=1)
              for old,new in items: s=s.replace(old,new)
              wr(f,s)

          add_before_main("best-mobile-detailing-software.html","QUOTEIQ-SEP18-MOBILE-GUIDE",
            '''<section class="section tight" aria-label="QuoteIQ September update"><div class="wrap article"><div class="note"><b>QuoteIQ September 2026 update:</b> current pricing now lists Online Booking &amp; Self-Scheduling across all plans, Google Calendar sync from Beginner, Client Portal Self-Scheduling from Pro, and automatic route optimization on Elite/Max. <a href="/quoteiq">Read the updated QuoteIQ review</a>.</div></div></section>''')
          add_before_main("best-ai-software-auto-detailing.html","QUOTEIQ-SEP18-AI-GUIDE",
            '''<section class="section tight" aria-label="QuoteIQ AI update"><div class="wrap article"><div class="note"><b>QuoteIQ September 2026 AI update:</b> its current matrix lists compatible-assistant connectivity across plans, with platform-availability caveats. <a href="/quoteiq">See the updated QuoteIQ review</a>.</div></div></section>''')

          sm=rd("sitemap.xml")
          sm=re.sub(r'\s*<url>\s*<loc>https://getdetailerfit\.com/quoteiq(?:\.html)?/?</loc>(?:\s*<lastmod>[^<]+</lastmod>)?\s*</url>',"",sm,flags=re.I)
          ent=f'  <url>\n    <loc>https://getdetailerfit.com/quoteiq</loc>\n    <lastmod>{TODAY}</lastmod>\n  </url>\n'
          if "</urlset>" not in sm: raise SystemExit("sitemap missing </urlset>")
          sm=sm.replace("</urlset>",ent+"</urlset>",1)
          ET.fromstring(sm); wr("sitemap.xml",sm)

          q=rd("quoteiq.html"); errs=[]
          if MARK not in q: errs.append("update block missing")
          if q.count(AFF)!=aff0 or aff0<1: errs.append("affiliate URL count changed/missing")
          if '<link rel="canonical" href="https://getdetailerfit.com/quoteiq">' not in q: errs.append("canonical changed/missing")
          for m in re.finditer(r'<a\b[^>]*href="https://admin-quoteiq\.web\.app/register\?via=ryo"[^>]*>',q,re.I):
              if "sponsored" not in m.group(0) or "noopener" not in m.group(0): errs.append("affiliate rel lost")
          for stale in [
            "CUSTOMER BOOKING</span><b>Elite · $299/mo",
            "Customer self-booking: the most important plan boundary",
            "customer self-booking through InstaSchedule starts on Elite",
            "InstaSchedule begins on Elite at $299/month"
          ]:
              if stale in q: errs.append("stale main claim: "+stale)
          if rd("styles.css")!=css0 or rd("app.js")!=js0: errs.append("shared CSS/JS changed")
          if rd("sitemap.xml").count("<loc>https://getdetailerfit.com/quoteiq</loc>")!=1: errs.append("sitemap duplicate/missing")
          if errs:
              print("VALIDATION FAILED")
              for e in errs: print(" -",e)
              raise SystemExit(1)

          print("PASS: QuoteIQ September 2026 update")
          print("PASS: affiliate URL preserved:",aff0)
          print("PASS: canonical preserved")
          print("PASS: styles.css/app.js unchanged")
          print("PASS: sitemap lastmod",TODAY)

          if WF.exists(): WF.unlink()
          if OLD_WF.exists(): OLD_WF.unlink()
          PY

      - name: Safety check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff --stat
          if git diff --name-only | grep -E '^(styles\.css|app\.js)$'; then
            echo "Shared CSS/JS changed unexpectedly"
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DetailerFit Research Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update QuoteIQ September 2026 features and booking facts"
          git push

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ## QuoteIQ September 2026 update — FIX
          - Updated `/quoteiq`
          - Corrected stale self-booking plan gates on relevant QuoteIQ pages
          - Added Google Calendar / AI connector / routing update context
          - Added internal freshness links from mobile + AI guides
          - Preserved QuoteIQ affiliate URL and sponsored markup
          - Preserved canonical and shared CSS/JS
          - Updated sitemap lastmod
          TEXT
