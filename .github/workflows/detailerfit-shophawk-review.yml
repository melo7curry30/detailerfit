                  raise SystemExit(
                      "shophawk-review.html already exists but was not created by this workflow. "
                      "Refusing to overwrite unrelated content."
                  )
              page_changed = old != page
          else:
              page_changed = True

          if page_changed:
              write(PAGE, page)

          discovery = {
              "reviews.html": (
                  "SHOPHAWK-FROM-REVIEWS",
                  '''
