                      <b>Another specialist option:</b> ShopHawk emphasizes lead ownership, financial visibility and multi-location scaling; OrbisX is a useful comparison for broader automation and established appearance-shop workflows.
                      <div class="actions"><a class="btn secondary" href="/shophawk-review">ShopHawk Review</a></div>
                    </div></div>
                  </section>
                  '''
              ),
          }

          touched = []
          seen_markers = set()
          for filename, (block_id, html) in discovery.items():
              # Avoid adding duplicate Urable/OrbisX blocks if both filename variants exist.
              if block_id in seen_markers:
                  continue
              path = ROOT / filename
              if path.is_file():
                  if upsert_block(path, block_id, html):
                      touched.append(filename)
                      seen_markers.add(block_id)

          # Sitemap: one canonical extensionless URL, replacing any prior ShopHawk variant.
          sitemap_path = ROOT / "sitemap.xml"
          sm = read(sitemap_path)
          sm = re.sub(
              r'\s*<url>\s*<loc>https://getdetailerfit\.com/shophawk-review(?:\.html)?/?</loc>[\s\S]*?</url>',
              "",
              sm,
              flags=re.I
          )
          entry = (
              "  <url>\n"
              f"    <loc>{CANONICAL}</loc>\n"
              f"    <lastmod>{TODAY}</lastmod>\n"
              "  </url>\n"
          )
          if "</urlset>" not in sm:
              raise SystemExit("sitemap.xml missing </urlset>")
          sm = sm.replace("</urlset>", entry + "</urlset>", 1)
          ET.fromstring(sm)
          write(sitemap_path, sm)

          # Validations.
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.h1 = 0
                  self.canonicals = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "h1":
                      self.h1 += 1
                  if tag == "link" and a.get("rel") == "canonical":
                      self.canonicals.append(a.get("href"))
                  if tag == "a":
                      self.links.append(a)

          current = read(PAGE)
          ins = Inspector()
          ins.feed(current)

          failures = []
          if MARKER not in current:
              failures.append("ownership marker missing")
          if ins.h1 != 1:
              failures.append(f"expected exactly one H1, found {ins.h1}")
          if ins.canonicals != [CANONICAL]:
              failures.append(f"canonical mismatch: {ins.canonicals}")
          if read(sitemap_path).count(f"<loc>{CANONICAL}</loc>") != 1:
              failures.append("sitemap canonical missing or duplicated")
          if "/shophawk-review" not in read("reviews.html"):
              failures.append("reviews.html missing discovery link")
          if 'href="/shophawk-review.html"' in "\n".join(read(p) for p in [PAGE] + [ROOT/x for x in touched]):
              failures.append("relative .html ShopHawk link remains")
          if 'rel="sponsored' in current or "data-vendor=\"ShopHawk\"" in current:
              failures.append("ShopHawk is not an affiliate yet; sponsored/vendor affiliate markup must not be added")
          if current.count("https://www.shophawk.io/") < 2:
              failures.append("official ShopHawk links unexpectedly missing")

          schema_match = re.search(
              r'<script type="application/ld\+json">([\s\S]*?)</script>',
              current, re.I
          )
          if not schema_match:
              failures.append("JSON-LD schema missing")
          else:
              try:
                  json.loads(schema_match.group(1).replace("<\\/", "</"))
              except Exception as e:
                  failures.append(f"JSON-LD invalid: {e}")

          for a in ins.links:
              href = a.get("href", "")
              if href.startswith("/") and not href.startswith("//"):
                  target = href.split("#", 1)[0].split("?", 1)[0].lstrip("/")
                  if not target:
                      continue
                  if target in {
                      "compare", "best-software-ppf-business", "best-car-wrap-software",
                      "best-ai-software-auto-detailing", "finder", "reviews",
                      "tint-wiz-review", "shopwrk-review"
                  }:
                      if not (ROOT / (target + ".html")).is_file():
                          failures.append(f"expected internal target missing: /{target}")

          if failures:
              print("VALIDATION FAILED")
              for f in failures:
                  print(" -", f)
              raise SystemExit(1)

          print("ShopHawk review publication patch passed.")
          print(f"Canonical: {CANONICAL}")
          print("Page:", PAGE.name)
          print("Discovery pages updated:", ", ".join(touched) if touched else "reviews.html only")
          print("Sitemap: OK")
          print("Affiliate markup: correctly absent")
          print("Shared styles.css/app.js: unchanged")

          # One-time workflow: remove itself only after all checks pass.
          if WORKFLOW.exists():
              WORKFLOW.unlink()
          PY

      - name: Show safe diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff --stat

          if git diff --name-only | grep -E '^(styles\.css|app\.js)$'; then
            echo "Shared CSS/JS changed unexpectedly."
            exit 1
          fi

      - name: Commit and push publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DetailerFit Publisher"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git diff --cached --check
          git commit -m "Publish ShopHawk review and internal links"
          git push

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ## ShopHawk Review — published

          Added:
          - `/shophawk-review`
          - Article + Breadcrumb + FAQ structured data
          - Reviews hub discovery link
          - Contextual internal links on relevant existing pages when present
          - Extensionless sitemap entry

          Preserved:
          - Existing DetailerFit design and shared CSS/JS
          - Existing rankings
          - Existing affiliate links
          - Editorial independence

          Important:
          - ShopHawk is not marked `sponsored` because no public affiliate/referral relationship is currently established.
          - External ShopHawk CTAs are normal official-site links.
          - Workflow self-deletes after a successful patch.
          TEXT
