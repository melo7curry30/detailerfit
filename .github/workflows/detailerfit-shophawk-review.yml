                    <div class="wrap article"><div class="note">
                      <b>Also evaluating ShopHawk?</b> Compare ShopHawk's sales ownership and multi-location reporting with Urable's vehicle-centric workflow and visual tools.
                      <div class="actions"><a class="btn secondary" href="/shophawk-review">ShopHawk Review</a></div>
                    </div></div>
                  </section>
                  '''
              ),
              "orbisx-review.html": (
                  "SHOPHAWK-FROM-ORBISX",
                  '''
