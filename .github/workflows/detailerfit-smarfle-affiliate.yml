name: DetailerFit - Add Smarfle Affiliate Revenue Paths

on:
  push:
    paths:
      - ".github/workflows/detailerfit-smarfle-affiliate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detailerfit-smarfle-affiliate
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Add Smarfle review and affiliate placements safely
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import re
          import xml.etree.ElementTree as ET

          ROOT = Path(".")
          AFFILIATE_URL = "https://www.smarfle.com/ref/ryyo5018"
          SLUG = "/smarfle-review-auto-detailers"
          CANONICAL = "https://getdetailerfit.com" + SLUG
          MARKER = "<!-- DETAILERFIT-SMARFLE-V1 -->"
          DISCLOSURE_MARKER = "<!-- DETAILERFIT-SMARFLE-DISCLOSURE-V1 -->"
          SOURCE_DATE = "September 15, 2026"
          ISO_DATE = "2026-09-15"

          OFFICIAL_HOME = "https://www.smarfle.com/"
          PRICING_URL = "https://www.smarfle.com/pricing"
          MOBILE_URL = "https://www.smarfle.com/features"
          PLAN_SUMMARY_URL = "https://www.smarfle.com/features"

          REQUIRED = [
              "reviews.html",
              "affiliate-disclosure.html",
              "sitemap.xml",
              "styles.css",
              "app.js",
          ]
          OPTIONAL = [
              "best-crm-solo-mobile-detailers.html",
              "best-mobile-detailing-software.html",
              "best-auto-detailing-software-2026.html",
              "guides.html",
          ]

          for name in REQUIRED:
              if not (ROOT / name).is_file():
                  raise RuntimeError(f"Required file missing: {name}")

          def read(name):
              return (ROOT / name).read_text(encoding="utf-8")

          def write(name, text):
              (ROOT / name).write_text(text, encoding="utf-8")

          original = {name: read(name) for name in REQUIRED}
          for name in OPTIONAL:
              if (ROOT / name).is_file():
                  original[name] = read(name)

          changes = {}

          def current(name):
              if name in changes:
                  return changes[name]
              path = ROOT / name
              return path.read_text(encoding="utf-8") if path.is_file() else None

          def insert_before_last(text, closing_tag, addition):
              pos = text.lower().rfind(closing_tag.lower())
              if pos < 0:
                  raise RuntimeError(f"Required closing tag missing: {closing_tag}")
              return text[:pos] + addition + "\n" + text[pos:]

          def tracked_cta(label):
              return (
                  '<a class="btn primary" data-vendor="Smarfle" '
                  f'href="{AFFILIATE_URL}" rel="sponsored noopener" '
                  f'target="_blank">{label}</a>'
              )

          LOCAL_DISCLOSURE = (
              '<p class="cta-disclosure small">'
              'DetailerFit may earn a commission if you sign up through this link, '
              'at no extra cost to you. '
              '<a href="/affiliate-disclosure">Affiliate disclosure</a>.'
              '</p>'
          )

          # ------------------------------------------------------------
          # 1) Dedicated research-based review.
          #    Reuse current DetailerFit header/footer and shared CSS/JS.
          # ------------------------------------------------------------
          base = original["reviews.html"]
          header_match = re.search(r"<header\b[\s\S]*?</header>", base, flags=re.I)
          footer_match = re.search(r"<footer\b[\s\S]*?</footer>", base, flags=re.I)
          if not header_match or not footer_match:
              raise RuntimeError("Could not reuse current DetailerFit header/footer.")

          header = header_match.group(0)
          footer = footer_match.group(0)

          schema = {
              "@context": "https://schema.org",
              "@graph": [
                  {
                      "@type": "Article",
                      "@id": CANONICAL + "#article",
                      "headline": "Smarfle Review for Auto Detailers (2026)",
                      "description": "Research-based Smarfle review for solo and mobile auto detailers covering CRM, booking, work orders, invoices, payments, mobile access, pricing and limitations.",
                      "dateModified": ISO_DATE,
                      "mainEntityOfPage": {"@type": "WebPage", "@id": CANONICAL},
                      "author": {"@type": "Organization", "name": "DetailerFit", "url": "https://getdetailerfit.com/"},
                      "publisher": {"@type": "Organization", "name": "DetailerFit", "url": "https://getdetailerfit.com/"},
                      "inLanguage": "en-US",
                  },
                  {
                      "@type": "BreadcrumbList",
                      "itemListElement": [
                          {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://getdetailerfit.com/"},
                          {"@type": "ListItem", "position": 2, "name": "Reviews", "item": "https://getdetailerfit.com/reviews"},
                          {"@type": "ListItem", "position": 3, "name": "Smarfle Review", "item": CANONICAL},
                      ],
                  },
              ],
          }

          review = f"""<!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#090d12">
          <title>Smarfle Review for Auto Detailers (2026) | DetailerFit</title>
          <meta name="description" content="Research-based Smarfle review for auto detailers: CRM, booking, work orders, invoices, payments, mobile workflow, pricing, fit and limitations.">
          <link rel="canonical" href="{CANONICAL}">
          <link rel="stylesheet" href="/styles.css">
          <meta property="og:title" content="Smarfle Review for Auto Detailers (2026)">
          <meta property="og:type" content="article">
          <meta property="og:url" content="{CANONICAL}">
          <meta name="twitter:card" content="summary">
          <script type="application/ld+json">{json.dumps(schema, separators=(",", ":"))}</script>
          </head><body>
          <a class="skip-link" href="#main-content">Skip to content</a>
          {header}
          {MARKER}
          <main id="main-content" tabindex="-1">
          <section class="heroMini"><div class="wrap">
          <div class="breadcrumbs"><a href="/">Home</a> / <a href="/reviews">Reviews</a> / Smarfle</div>
          <span class="eyebrow">SERVICE BUSINESS CRM · RESEARCH-BASED · {SOURCE_DATE}</span>
          <h1>Smarfle Review for Solo &amp; Mobile Auto Detailers</h1>
          <p class="lead">Smarfle combines client management, public booking, work orders, invoicing and Stripe payments in one service-business platform. Its $19 Solo plan makes it especially interesting for one-person operators, but it is a general local-service CRM rather than detailing-specific software.</p>
          <div class="actions">{tracked_cta("Try Smarfle")}<a class="btn secondary" href="/best-crm-solo-mobile-detailers">Compare Detailing CRMs</a></div>
          {LOCAL_DISCLOSURE}
          </div></section>

          <section class="section"><div class="wrap article">
          <aside class="research-context research-block" aria-label="Research transparency"><details open>
          <summary>Research-based · Source check: {SOURCE_DATE} · How we researched this</summary>
          <div><strong>Research basis</strong><span>Current Smarfle product, pricing and feature documentation.</span></div>
          <div><strong>Hands-on testing</strong><span>Not claimed for this review.</span></div>
          <div><strong>Positioning</strong><span>Smarfle is evaluated as general local-service CRM and operations software, not auto-detailing-specific software.</span></div>
          <p><a href="/methodology">How we review software</a> · <a href="/affiliate-disclosure">Affiliate disclosure</a>.</p>
          </details></aside>

          <h2>Quick verdict</h2>
          <div class="verdict"><p><strong>Best fit:</strong> solo or small mobile detailers who want a low-cost system for clients, online booking, work orders, photos, invoices and payments.</p>
          <p><strong>Look elsewhere first if:</strong> you require a detailing-native workflow with proven vehicle-specific records, detailing package logic or other specialist automotive features.</p></div>

          <h2>Current pricing</h2>
          <p>All published plans currently include a 7-day free trial with no credit card required.</p>
          <div class="tablewrap" role="region" tabindex="0" aria-label="Smarfle pricing"><table>
          <thead><tr><th>Plan</th><th>Price</th><th>Published capacity</th></tr></thead><tbody>
          <tr><td>Solo</td><td>$19/mo</td><td>1 user, up to 100 clients</td></tr>
          <tr><td>Starter</td><td>$99/mo</td><td>Up to 5 users, up to 200 clients</td></tr>
          <tr><td>Professional</td><td>$199/mo</td><td>Up to 10 users, up to 500 clients</td></tr>
          <tr><td>Business</td><td>$349/mo</td><td>Up to 30 users, up to 1,000 clients</td></tr>
          </tbody></table></div>

          <h2>Why it can fit a mobile detailer</h2>
          <p>The Solo plan publishes a public booking link and calendar, client management, work orders with photos, invoices, Stripe payments, activity log, tags, custom fields, Mobile PWA and CSV import/export. That covers a useful operating core for a one-person detailing business.</p>
          <p>Smarfle's payment documentation currently lists a 0.5% platform fee in addition to payment-processing fees, so compare payment economics before committing.</p>

          <h2>Where it is weaker for detailing</h2>
          <p>Smarfle is built broadly for local service businesses. DetailerFit does not treat general custom fields or work orders as equivalent to specialist vehicle inspection, package, coating, shop or automotive workflows. Test those requirements directly before migrating.</p>

          <div class="actions">{tracked_cta("Start the 7-Day Trial")}<a class="btn secondary" href="/finder">Use the Software Finder</a></div>
          {LOCAL_DISCLOSURE}

          <h2>Official sources</h2>
          <div class="sourcebox">
          <a href="https://www.smarfle.com/" rel="noopener" target="_blank">Smarfle — Official site</a><br>
          <a href="https://www.smarfle.com/pricing" rel="noopener" target="_blank">Smarfle — Pricing</a><br>
          <a href="https://www.smarfle.com/features" rel="noopener" target="_blank">Smarfle — Features</a>
          </div>
          <p class="small">Source check: {SOURCE_DATE}. Features and pricing can change. Verify current product details directly with Smarfle before purchase.</p>

          <h2>Final check before subscribing</h2>
          <p>Use the free trial to create a customer, book a mobile detail, attach job photos, generate an invoice and test the payment flow. If those steps feel natural and you do not need deeper automotive-specific tooling, Smarfle's Solo plan may be a compelling low-cost option.</p>
          <div class="actions">{tracked_cta("Try Smarfle")}<a class="btn secondary" href="/best-crm-solo-mobile-detailers">Compare CRM Options</a></div>
          {LOCAL_DISCLOSURE}
          </div></section></main>
          {footer}
          <script src="/app.js"></script>
          </body></html>
          """

          review_path = ROOT / "smarfle-review-auto-detailers.html"
          if review_path.exists():
              existing = read(review_path.name)
              if MARKER not in existing:
                  raise RuntimeError("smarfle-review-auto-detailers.html already exists without the DetailerFit marker.")
          else:
              changes[review_path.name] = review

          # ------------------------------------------------------------
          # 2) Additive placements. Existing rankings are not changed.
          # ------------------------------------------------------------
          placements = {
              "reviews.html": ("SERVICE BUSINESS CRM", "Smarfle for solo & mobile detailers", "Smarfle combines client management, public booking, work orders with photos, invoicing and Stripe payments. Its low-cost Solo plan makes it worth researching for one-person detailing businesses.", "Read the Smarfle review"),
              "best-crm-solo-mobile-detailers.html": ("ALSO CONSIDER · SERVICE CRM", "Smarfle for budget-conscious solo operators", "Smarfle is a general local-service CRM rather than detailing-native software. Its Solo plan can be worth a separate look when booking, work orders, invoicing and payments matter more than specialist automotive workflow. This does not change the ranked picks above.", "Evaluate Smarfle"),
              "best-mobile-detailing-software.html": ("ALSO CONSIDER · LOW-COST OPERATIONS", "Smarfle as a mobile service-business stack", "Smarfle can combine booking, client management, work orders, photos, invoicing and payments for a solo mobile operator. It is evaluated separately from detailing-native software and does not change the rankings above.", "See the Smarfle review"),
              "best-auto-detailing-software-2026.html": ("ALSO CONSIDER · GENERAL SERVICE CRM", "Smarfle for a simple all-in-one workflow", "Smarfle is not presented as detailing-specific software, but its low-cost Solo plan makes it relevant to operators comparing general service-business CRM and job-management tools.", "Research Smarfle"),
              "guides.html": ("CRM REVIEW", "Smarfle for solo & mobile detailers", "Research Smarfle's service-business CRM, booking, work orders, invoicing, payments and mobile workflow for a detailing business.", "Read the Smarfle review"),
          }

          for filename, (kicker, heading, paragraph, label) in placements.items():
              if not (ROOT / filename).is_file():
                  continue
              page_text = current(filename)
              page_marker = f"{MARKER}-{filename}"
              if page_marker in page_text:
                  continue
              block = f"""
          {page_marker}
          <section class="section tight" aria-labelledby="smarfle-option-{filename.replace('.', '-')}">
          <div class="wrap article"><div class="card">
          <div class="kicker">{kicker}</div>
          <h2 id="smarfle-option-{filename.replace('.', '-')}">{heading}</h2>
          <p>{paragraph}</p>
          <p class="small">Research checked {SOURCE_DATE}. Smarfle is a general local-service CRM, not auto-detailing-specific software.</p>
          <div class="actions"><a class="btn secondary" href="{SLUG}">{label}</a>{tracked_cta("Visit Smarfle")}</div>
          {LOCAL_DISCLOSURE}
          </div></div></section>
          """
              changes[filename] = insert_before_last(page_text, "</main>", block)

          # ------------------------------------------------------------
          # 3) Affiliate disclosure — additive relationship note.
          # ------------------------------------------------------------
          disclosure = current("affiliate-disclosure.html")
          if DISCLOSURE_MARKER not in disclosure:
              disclosure_block = f"""
          {DISCLOSURE_MARKER}
          <section class="section tight" aria-labelledby="smarfle-affiliate-relationship">
          <div class="wrap article"><div class="note">
          <h2 id="smarfle-affiliate-relationship">Smarfle affiliate relationship</h2>
          <p>DetailerFit participates in the Smarfle affiliate program and may earn a commission from qualifying paid subscriptions made through clearly marked Smarfle affiliate links, at no extra cost to the reader. Affiliate compensation does not buy ranking position or change our editorial conclusions.</p>
          </div></div></section>
          """
              changes["affiliate-disclosure.html"] = insert_before_last(
                  disclosure, "</main>", disclosure_block
              )

          # ------------------------------------------------------------
          # 4) Sitemap — add dedicated review once.
          # ------------------------------------------------------------
          sitemap = current("sitemap.xml")
          ET.fromstring(sitemap)
          locs = re.findall(r"<loc>\s*(.*?)\s*</loc>", sitemap, flags=re.I)
          if CANONICAL not in locs:
              sitemap = insert_before_last(
                  sitemap,
                  "</urlset>",
                  f"  <url><loc>{CANONICAL}</loc><lastmod>{ISO_DATE}</lastmod></url>",
              )
              ET.fromstring(sitemap)
              changes["sitemap.xml"] = sitemap

          # ------------------------------------------------------------
          # 5) Validation.
          # ------------------------------------------------------------
          class Elements(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.canonicals = []
                  self.h1_count = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == "a":
                      self.links.append(attrs)
                  elif tag == "link" and attrs.get("rel") == "canonical":
                      self.canonicals.append(attrs.get("href"))
                  elif tag == "h1":
                      self.h1_count += 1

          def parse_html(text):
              parser = Elements()
              parser.feed(text)
              return parser

          final_review = changes.get(
              review_path.name,
              review_path.read_text(encoding="utf-8") if review_path.exists() else "",
          )
          parsed_review = parse_html(final_review)

          if parsed_review.canonicals != [CANONICAL]:
              raise RuntimeError("Smarfle review canonical is invalid.")
          if parsed_review.h1_count != 1:
              raise RuntimeError("Smarfle review must contain exactly one H1.")

          review_affiliate_links = [
              a for a in parsed_review.links if a.get("href") == AFFILIATE_URL
          ]
          if len(review_affiliate_links) != 3:
              raise RuntimeError(
                  f"Expected exactly three Smarfle affiliate CTAs on review page; "
                  f"found {len(review_affiliate_links)}."
              )

          for a in review_affiliate_links:
              rel_tokens = set((a.get("rel") or "").lower().split())
              if not {"sponsored", "noopener"}.issubset(rel_tokens):
                  raise RuntimeError("Review CTA missing sponsored/noopener.")
              if a.get("data-vendor") != "Smarfle":
                  raise RuntimeError("Review CTA missing data-vendor=Smarfle.")
              if a.get("target") != "_blank":
                  raise RuntimeError("Review CTA missing target=_blank.")

          if final_review.count("at no extra cost to you") < 3:
              raise RuntimeError("Each review-page affiliate CTA needs a nearby disclosure.")

          for required_text in [
              "$19/mo", "$99/mo", "$199/mo", "$349/mo",
              "7-day free trial", "public booking", "work orders",
              "Stripe payments", "Mobile PWA", "0.5%",
              "https://www.smarfle.com/pricing",
              "https://www.smarfle.com/features",
          ]:
              if required_text not in final_review:
                  raise RuntimeError(f"Smarfle review validation missing: {required_text}")

          # Official source URLs remain editorial/untracked.
          for source_url in [OFFICIAL_HOME, PRICING_URL, MOBILE_URL]:
              if source_url not in final_review:
                  raise RuntimeError(f"Official source missing: {source_url}")

          # Validate every Smarfle tracked link in resulting changed HTML.
          affiliate_count = 0
          for filename, text in changes.items():
              if not filename.endswith(".html") or AFFILIATE_URL not in text:
                  continue
              parsed = parse_html(text)
              for a in parsed.links:
                  if a.get("href") != AFFILIATE_URL:
                      continue
                  affiliate_count += 1
                  rel_tokens = set((a.get("rel") or "").lower().split())
                  if not {"sponsored", "noopener"}.issubset(rel_tokens):
                      raise RuntimeError(f"Missing sponsored/noopener in {filename}")
                  if a.get("data-vendor") != "Smarfle":
                      raise RuntimeError(f"Missing Smarfle data-vendor in {filename}")
                  if a.get("target") != "_blank":
                      raise RuntimeError(f"Missing target=_blank in {filename}")

          # If review already existed and is not in changes, count it too.
          if review_path.exists() and review_path.name not in changes:
              for a in parsed_review.links:
                  if a.get("href") == AFFILIATE_URL:
                      affiliate_count += 1

          if affiliate_count < 4:
              raise RuntimeError(
                  f"Expected multiple Smarfle affiliate paths; found {affiliate_count}"
              )

          final_sitemap = changes.get("sitemap.xml", original["sitemap.xml"])
          if final_sitemap.count(CANONICAL) != 1:
              raise RuntimeError(
                  f"Smarfle review URL must appear exactly once in sitemap; "
                  f"found {final_sitemap.count(CANONICAL)}."
              )
          ET.fromstring(final_sitemap)

          final_disclosure = changes.get(
              "affiliate-disclosure.html",
              original["affiliate-disclosure.html"],
          )
          if "Smarfle affiliate relationship" not in final_disclosure:
              raise RuntimeError("Smarfle affiliate relationship disclosure is missing.")

          # Shared design/behavior assets must remain untouched.
          if current("styles.css") != original["styles.css"]:
              raise RuntimeError("styles.css changed unexpectedly.")
          if current("app.js") != original["app.js"]:
              raise RuntimeError("app.js changed unexpectedly.")

          # Existing rankings are protected because all guide placements are
          # additive blocks immediately before </main>.
          for filename in placements:
              if filename not in changes or filename not in original:
                  continue
              before = original[filename]
              after = changes[filename]
              if not after.startswith(before[: min(500, len(before))]):
                  raise RuntimeError(f"Unexpected rewrite detected in {filename}")
              # Existing ranked list text, when present, must survive verbatim.
              ranked_match = re.search(
                  r'(<ol class=["\']list["\']>[\s\S]*?</ol>)',
                  before,
                  flags=re.I,
              )
              if ranked_match and ranked_match.group(1) not in after:
                  raise RuntimeError(f"Existing ranked list changed in {filename}")

          # Write only after validation succeeds.
          for filename, text in changes.items():
              write(filename, text)

          print("Written files:")
          for filename in sorted(changes):
              print(" -", filename)
          print(f"PASS: {affiliate_count} Smarfle affiliate CTA(s) validated")
          print("PASS: rel=sponsored noopener + data-vendor=Smarfle + target=_blank")
          print("PASS: dedicated review + current pricing + mobile CRM sources")
          print("PASS: existing ranked picks preserved; guide placements are additive")
          print("PASS: affiliate disclosure + sitemap")
          print("UNCHANGED: styles.css and app.js")

      - name: Commit website changes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            smarfle-review-auto-detailers.html \
            reviews.html \
            affiliate-disclosure.html \
            sitemap.xml

          for f in \
            best-crm-solo-mobile-detailers.html \
            best-mobile-detailing-software.html \
            best-auto-detailing-software-2026.html \
            guides.html
          do
            if [ -f "$f" ]; then
              git add -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new changes. Smarfle implementation already exists."
            exit 0
          fi

          git diff --cached --check
          git commit -m "Add Smarfle review and affiliate revenue paths"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write result summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          ## Smarfle affiliate implementation

          Affiliate URL:
          `https://www.smarfle.com/ref/ryyo5018`

          Added safely:
          - `/smarfle-review-auto-detailers` research-based review
          - Revenue/discovery placement on Reviews
          - Additive placements on CRM, mobile software, best-software and Guides pages when present
          - Smarfle relationship on Affiliate Disclosure
          - Sitemap entry

          Current official product facts used:
          - Solo: $19/mo, 1 user, up to 100 clients
          - Starter: $99/mo, up to 5 users, up to 200 clients
          - Professional: $199/mo, up to 10 users, up to 500 clients
          - Business: $349/mo, up to 30 users, up to 1,000 clients
          - 7-day free trial, no credit card required
          - Solo includes public booking, client management, work orders with photos,
            invoices, Stripe payments and mobile PWA
          - Source check: September 15, 2026

          Editorial safeguards:
          - Smarfle is presented as general local-service CRM software,
            not auto-detailing-specific software
          - Existing ranked picks are not changed
          - No Finder ranking manipulation
          - Shared `styles.css` and `app.js` remain unchanged

          Affiliate-link validation:
          - `rel="sponsored noopener"`
          - `data-vendor="Smarfle"`
          - `target="_blank"`
          - Local commission disclosure near tracked CTAs
          - Exactly three tracked CTAs on the dedicated review page

          Affiliate-program note:
          - Current main affiliate page advertises tiered 15%-25% recurring commission
            for 12 months based on active paying referrals
          - 90-day tracking cookie
          - Stripe Connect payouts
          TEXT
