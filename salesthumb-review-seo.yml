name: DetailerFit SalesThumb Review SEO Wiring

on:
  push:
    paths:
      - ".github/workflows/salesthumb-review-seo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-salesthumb-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire review into site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          DOMAIN = 'https://getdetailerfit.com'
          SLUG = 'salesthumb-review'
          URL = f'{DOMAIN}/{SLUG}'
          PAGE = ROOT / f'{SLUG}.html'
          WORKFLOW = ROOT / '.github/workflows/salesthumb-review-seo.yml'
          TODAY = '2026-09-16'

          def read(p): return p.read_text(encoding='utf-8')
          def write(p, text): p.write_text(text, encoding='utf-8')

          def insert_before_main_close(text, block):
              idx = text.lower().rfind('</main>')
              if idx >= 0: return text[:idx] + '\n' + block + '\n' + text[idx:]
              idx = text.lower().rfind('</body>')
              if idx >= 0: return text[:idx] + '\n' + block + '\n' + text[idx:]
              return text + '\n' + block + '\n'

          def upsert_block(path, block_id, block):
              if not path.exists():
                  print(f'Skip missing: {path.name}')
                  return
              text = read(path)
              wrapped = f'<!-- {block_id} START -->\n{block}\n<!-- {block_id} END -->'
              pat = re.compile(rf'<!-- {re.escape(block_id)} START -->.*?<!-- {re.escape(block_id)} END -->', re.I | re.S)
              if pat.search(text):
                  text = pat.sub(wrapped, text, count=1)
              elif f'/{SLUG}' not in text and URL not in text:
                  text = insert_before_main_close(text, wrapped)
              write(path, text)

          if not PAGE.exists():
              raise SystemExit('Missing salesthumb-review.html. Add the article to the repo first.')

          text = read(PAGE)
          canonical = f'<link rel="canonical" href="{URL}">'
          if re.search(r'<link[^>]+rel=["\']canonical["\'][^>]*>', text, re.I):
              text = re.sub(r'<link[^>]+rel=["\']canonical["\'][^>]*>', canonical, text, count=1, flags=re.I)
          else:
              text = text.replace('</head>', canonical + '\n</head>', 1)
          if re.search(r'<meta[^>]+property=["\']og:url["\'][^>]*>', text, re.I):
              text = re.sub(r'<meta[^>]+property=["\']og:url["\'][^>]*>', f'<meta property="og:url" content="{URL}">', text, count=1, flags=re.I)
          text = re.sub(r'href=(["\'])(?!https?://|//|#|mailto:|tel:)([^"\']+?)\.html([?#][^"\']*)?\1', lambda m: f'href={m.group(1)}{m.group(2)}{m.group(3) or ""}{m.group(1)}', text, flags=re.I)
          write(PAGE, text)

          reviews_block = f'''<section class="section" aria-label="SalesThumb review"><div class="wrap article"><div class="card"><div class="kicker">NEW · AI FRONT OFFICE</div><h2><a href="/{SLUG}">SalesThumb Review (2026)</a></h2><p>SalesThumb combines CRM, booking, payments, film inventory and customer retention with AI inbox tools, smart pricing and Pro-tier photo-to-quote for tint, PPF, ceramic, detailing and wrap shops.</p><a class="text-link" href="/{SLUG}">Read the SalesThumb review</a></div></div></section>'''
          upsert_block(ROOT / 'reviews.html', 'SALESTHUMB-REVIEWS-HUB', reviews_block)

          ai_block = f'''<section class="section" aria-label="SalesThumb AI software note"><div class="wrap article"><div class="note"><b>Emerging AI front-office platform:</b> SalesThumb now publishes AI inbox triage, reply drafts, cancellation slot-fill, smart pricing and Pro-tier photo-to-quote for tint, PPF, ceramic and detailing shops.</div><div class="actions"><a class="btn secondary" href="/{SLUG}">Read our SalesThumb Review</a></div></div></section>'''
          upsert_block(ROOT / 'best-ai-software-auto-detailing.html', 'SALESTHUMB-FROM-AI', ai_block)

          software_block = f'''<section class="section" aria-label="SalesThumb software alternative"><div class="wrap article"><div class="note"><b>New multi-service option:</b> SalesThumb is an emerging shop OS for tint, PPF, ceramic, detailing and wrap, with CRM, booking, inventory, payments and higher-tier AI tools.</div><div class="actions"><a class="btn secondary" href="/{SLUG}">SalesThumb Review</a></div></div></section>'''
          upsert_block(ROOT / 'best-auto-detailing-software-2026.html', 'SALESTHUMB-FROM-BEST-SOFTWARE', software_block)

          ppf_block = f'''<section class="section" aria-label="SalesThumb for PPF shops"><div class="wrap article"><div class="note"><b>Also compare SalesThumb:</b> Higher tiers add multi-vertical operations, film-aware inventory, warranty tools, smart pricing and Pro-tier AI photo-to-quote.</div><div class="actions"><a class="btn secondary" href="/{SLUG}">SalesThumb Review</a></div></div></section>'''
          upsert_block(ROOT / 'best-software-ppf-business.html', 'SALESTHUMB-FROM-PPF', ppf_block)

          wrap_block = f'''<section class="section" aria-label="SalesThumb for wrap shops"><div class="wrap article"><div class="note"><b>Multi-service shop alternative:</b> SalesThumb also supports vinyl wrap alongside tint, PPF, ceramic and detailing, with multi-vertical support beginning on Growth.</div><div class="actions"><a class="btn secondary" href="/{SLUG}">Read the SalesThumb Review</a></div></div></section>'''
          upsert_block(ROOT / 'best-car-wrap-software.html', 'SALESTHUMB-FROM-WRAP', wrap_block)

          tint_block = f'''<section class="section" aria-label="SalesThumb alternative"><div class="wrap article"><div class="note"><b>Another film-shop option:</b> SalesThumb is a newer competitor with higher-tier AI front-office tools, smart pricing, customer galleries and multi-service support.</div><div class="actions"><a class="btn secondary" href="/{SLUG}">SalesThumb Review</a></div></div></section>'''
          upsert_block(ROOT / 'tint-wiz-review.html', 'SALESTHUMB-FROM-TINTWIZ', tint_block)

          sitemap = ROOT / 'sitemap.xml'
          if not sitemap.exists(): raise SystemExit('Missing sitemap.xml')
          sm = read(sitemap)
          sm = re.sub(rf'\s*<url>\s*<loc>[^<]*{re.escape(SLUG)}(?:\.html)?</loc>.*?</url>', '', sm, flags=re.I | re.S)
          entry = '  <url>\n' + f'    <loc>{URL}</loc>\n' + f'    <lastmod>{TODAY}</lastmod>\n' + '  </url>\n'
          if '</urlset>' not in sm: raise SystemExit('sitemap.xml missing </urlset>')
          sm = sm.replace('</urlset>', entry + '</urlset>', 1)
          write(sitemap, sm)

          failures = []
          page_now = read(PAGE)
          if read(sitemap).count(f'<loc>{URL}</loc>') != 1: failures.append('sitemap canonical entry missing or duplicated')
          if URL not in page_now: failures.append('article canonical URL missing')
          rel_html = [h for h in re.findall(r'href=["\']([^"\']+)["\']', page_now, flags=re.I) if '.html' in h and not h.startswith(('http://','https://'))]
          if rel_html: failures.append('relative .html links remain: ' + ', '.join(rel_html[:5]))
          for p in [ROOT/'reviews.html', ROOT/'best-ai-software-auto-detailing.html', ROOT/'best-auto-detailing-software-2026.html']:
              if p.exists() and f'/{SLUG}' not in read(p): failures.append(f'{p.name} missing SalesThumb internal link')
          if failures:
              print('VALIDATION FAILED')
              for f in failures: print(' -', f)
              raise SystemExit(1)
          print('SalesThumb review SEO wiring passed.')
          print(f'Canonical: {URL}')
          print('Sitemap: OK')
          print('Internal discovery links: OK')
          if WORKFLOW.exists(): WORKFLOW.unlink()
          PY

      - name: Show changes
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "DetailerFit SEO"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Publish SalesThumb review and wire internal links"
          git push
